                hoveredModel = hitModel;
                clearTimeout(infoPopupHideTimer);
                infoPopup.style.display = 'none';
                if (hoveredModel) {
                    triggerInteraction(hoveredModel, 'onHover', event.clientX, event.clientY);
                }
            }
        });

        // ---------------------------------------------------------------
        // INPUT: CONTROLLER VR (laser pointer)
        // ---------------------------------------------------------------
        const controller1 = renderer.xr.getController(0);
        const controller2 = renderer.xr.getController(1);
        // Controller MESTI jadi anak cameraRig (sama macam mainCamera), bukan scene
        // terus — kalau tidak, bila cameraRig "teleport" (ikut Kedudukan Awal Kamera
        // scene semasa), pandangan berpindah tapi controller kekal di kedudukan asal
        // (dekat origin dunia) — tangan/laser jadi terputus & salah trajektori
        // berbanding apa yang pengguna nampak/rasa.
        cameraRig.add(controller1);
        cameraRig.add(controller2);

        const CONTROLLER_LASER_MAX_LENGTH = 5;
        const CONTROLLER_LASER_IDLE_LENGTH = 1.6;
        const CONTROLLER_LASER_RADIUS = 0.005;
        const CONTROLLER_TRIGGER_FLASH_MS = 180;

        // Laser dibina sebagai TIUB melengkung (quadratic bezier), dikira semula
        // setiap frame ikut jarak hit semasa — bukan silinder lurus tegar. Hujung
        // PANGKAL (P0) sentiasa di controller dengan tangen awal lurus ke hadapan
        // (P1 diletak terus di depan P0, cuma sedikit "melentik" ke bawah), dan
        // hujung AKHIR (P2) sentiasa TEPAT di titik hit sebenar (sama dgn raycast
        // lurus yang dipakai untuk selection) — jadi nampak lebih natural/selesa
        // tanpa jejaskan ketepatan sasaran.
        const controllerLaserCurveP0 = new THREE.Vector3();
        const controllerLaserCurveP1 = new THREE.Vector3();
        const controllerLaserCurveP2 = new THREE.Vector3();
        const controllerLaserCurve = new THREE.QuadraticBezierCurve3(controllerLaserCurveP0, controllerLaserCurveP1, controllerLaserCurveP2);

        // Tiub dibina TANGAN (bukan terus THREE.TubeGeometry) supaya jejari boleh
        // berubah sepanjang panjang (taper) — perlu untuk hujung "menirus" semasa
        // idle. Frenet frame dari curve tu yang bagi orientasi cincin tiap gelang.
        function buildLaserTubeGeometry(curve, tubularSegments, baseRadius, radialSegments, taperFn) {
            const frames = curve.computeFrenetFrames(tubularSegments, false);
            const points = curve.getPoints(tubularSegments);
            const positions = [];
            const indices = [];

            for (let i = 0; i <= tubularSegments; i++) {
                const t = i / tubularSegments;
                const radius = baseRadius * taperFn(t);
                const normal = frames.normals[i];
                const binormal = frames.binormals[i];
                const center = points[i];
                for (let j = 0; j <= radialSegments; j++) {
                    const angle = (j / radialSegments) * Math.PI * 2;
                    const sin = Math.sin(angle), cos = -Math.cos(angle);
                    const x = cos * normal.x + sin * binormal.x;
                    const y = cos * normal.y + sin * binormal.y;
                    const z = cos * normal.z + sin * binormal.z;
                    positions.push(center.x + radius * x, center.y + radius * y, center.z + radius * z);
                }
            }

            for (let i = 1; i <= tubularSegments; i++) {
                for (let j = 1; j <= radialSegments; j++) {
                    const a = (radialSegments + 1) * (i - 1) + (j - 1);
                    const b = (radialSegments + 1) * i + (j - 1);
                    const c = (radialSegments + 1) * i + j;
                    const d = (radialSegments + 1) * (i - 1) + j;
                    indices.push(a, b, d, b, c, d);
                }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setIndex(indices);
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            return geometry;
        }

        const laserTaperFull = () => 1;
        // Idle: jejari kekal penuh untuk 60% awal, lepas tu menirus terus ke 0 di
        // hujung — nampak "hilang" secara natural, bukan terputus tiba-tiba.
        function laserTaperIdle(t) {
            const taperStart = 0.6;
            if (t < taperStart) return 1;
            return 1 - (t - taperStart) / (1 - taperStart);
        }

        function buildControllerLaserCurveGeometry(distance, isIdle) {
            // Idle: tangen/lengkung dikurangkan supaya nampak lebih lurus (sebab
            // laser ni belum "mengunci" apa-apa sasaran). Bila kena objek, kekal
            // lengkung lembut asal.
            const arc = isIdle ? Math.min(distance * 0.03, 0.06) : Math.min(distance * 0.12, 0.25);
            controllerLaserCurveP0.set(0, 0, 0);
            controllerLaserCurveP1.set(0, arc, -distance * 0.5);
            controllerLaserCurveP2.set(0, 0, -distance);
            return buildLaserTubeGeometry(controllerLaserCurve, 12, CONTROLLER_LASER_RADIUS, 6, isIdle ? laserTaperIdle : laserTaperFull);
        }

        // depthTest AKTIF — laser mesti hormat kedalaman SEBENAR dalam scene (ter-
        // sorok di belakang objek yang lebih dekat dengan kamera berbanding titik
        // yang disasar), supaya perspektif/occlusion antara dua objek berbeza jarak
        // kekal betul. depthWrite dimatikan supaya laser (nipis & lutsinar) sendiri
        // tak "menghalang" ujian kedalaman objek lut sinar lain di belakangnya.
        const controllerLaserMaterial = new THREE.MeshBasicMaterial({
            color: 0x00e5ff,
            transparent: true,
            opacity: 0.9,
            depthTest: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            toneMapped: false
        });

        const controllerDotGeometry = new THREE.SphereGeometry(0.025, 16, 16);
        // Cincin padat (bukan bebola lut sinar/halo kabur) di sekeliling titik —
        // penanda TEGAS & jelas supaya hujung laser tak nampak macam terapung
        // tanpa kena mengena dengan objek, walaupun titik sendiri kecil dari jauh.
        const controllerRingGeometry = new THREE.RingGeometry(0.032, 0.044, 24);

        [controller1, controller2].forEach(ctrl => {
            ctrl.addEventListener('connected', (event) => {
                ctrl.userData.handedness = event.data && event.data.handedness;
                // 'screen' = tap tanpa jejak kedudukan (telefon AR); 'tracked-pointer' =
                // controller 6DOF sebenar (VR ATAU headset AR fizikal) — lihat index.html.
                ctrl.userData.targetRayMode = event.data && event.data.targetRayMode;
            });

            // Bahan laser KLON berasingan setiap controller (bukan kongsi satu
            // instance) — sebab opacity dia berubah ikut status hit SETIAP
            // controller secara berasingan (idle vs kena objek).
            const laser = new THREE.Mesh(buildControllerLaserCurveGeometry(CONTROLLER_LASER_IDLE_LENGTH, true), controllerLaserMaterial.clone());
            laser.name = 'controller-laser';
            laser.renderOrder = 998;
            ctrl.add(laser);

            const dot = new THREE.Mesh(controllerDotGeometry, new THREE.MeshBasicMaterial({
                color: 0x00e5ff, transparent: true, opacity: 0.95, depthTest: true, depthWrite: false,
                blending: THREE.AdditiveBlending, toneMapped: false
            }));
            dot.name = 'controller-laser-dot';
            dot.position.set(0, 0, -CONTROLLER_LASER_IDLE_LENGTH);
            dot.renderOrder = 999;
            ctrl.add(dot);

            const ring = new THREE.Mesh(controllerRingGeometry, new THREE.MeshBasicMaterial({
                color: 0x00e5ff, transparent: true, opacity: 1, depthTest: true, depthWrite: false,
                side: THREE.DoubleSide, blending: THREE.AdditiveBlending, toneMapped: false
            }));
            ring.name = 'controller-laser-ring';
            ring.position.set(0, 0, -CONTROLLER_LASER_IDLE_LENGTH);
            ring.renderOrder = 999;
            ring.visible = false;
            ctrl.add(ring);

            ctrl.userData.laser = laser;
            ctrl.userData.laserDot = dot;
            ctrl.userData.laserRing = ring;
            ctrl.userData.triggerFlashUntil = 0;
        });

        // Kilauan kuning/putih SEKETIKA pada hujung laser bila trigger ditekan —
        // bukan status hover berterusan (hover kekal biru). Ini bagi maklum balas
        // visual yang jelas untuk tindakan "klik" itu sendiri.
        function flashControllerTrigger(event) {
            const controller = event.target;
            const hitModel = getControllerRaycastHit(controller);
            if (hitModel) {
                controller.userData.triggerFlashUntil = performance.now() + CONTROLLER_TRIGGER_FLASH_MS;
            }
        }
        controller1.addEventListener('selectstart', flashControllerTrigger);
        controller2.addEventListener('selectstart', flashControllerTrigger);

        const controllerRaycaster = new THREE.Raycaster();
        const controllerTempMatrix = new THREE.Matrix4();
        const controllerTempCamPos = new THREE.Vector3();

        function getControllerRaycastHit(controller) {
            controllerTempMatrix.identity().extractRotation(controller.matrixWorld);
            controllerRaycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
            controllerRaycaster.ray.direction.set(0, 0, -1).applyMatrix4(controllerTempMatrix);

            let hitModel = null;
            let hitDistance = CONTROLLER_LASER_MAX_LENGTH;

            if (loadedModelsList.length > 0) {
                const visibleObjects = loadedModelsList.filter(o => o.visible);
                const intersects = controllerRaycaster.intersectObjects(visibleObjects, true);
                if (intersects.length > 0) {
                    hitDistance = Math.min(intersects[0].distance, CONTROLLER_LASER_MAX_LENGTH);
                    hitModel = intersects[0].object;
                    while (hitModel.parent && hitModel.parent !== scene && hitModel.parent !== contentRoot) {
                        hitModel = hitModel.parent;
                    }
                }
            }

            // TIADA sasaran — laser "hilang" pada jarak pendek yang sesuai (bukan
            // sentiasa sampai jarak maksimum 5m macam rod tegar). ADA sasaran — laser
            // sambung terus ke titik hit sebenar, berapa jauh sekalipun.
            const didHit = !!hitModel;
            const displayDistance = didHit ? hitDistance : CONTROLLER_LASER_IDLE_LENGTH;

            const laser = controller.userData.laser;
            if (laser) {
                laser.geometry.dispose();
                laser.geometry = buildControllerLaserCurveGeometry(displayDistance, !didHit);
                laser.material.opacity = didHit ? 0.9 : 0.3;
            }

            // Kilauan kuning/putih HANYA seketika lepas trigger ditekan (lihat
            // flashControllerTrigger) — selain tu laser/titik kekal biru tak kira
            // sedang hover objek atau tidak.
            const isFlashing = performance.now() < (controller.userData.triggerFlashUntil || 0);
            const hitColor = isFlashing ? 0xffffff : 0x00e5ff;

            // Saiz titik berkadar SONGSANG dengan jarak — lebih besar untuk objek
            // dekat, lebih kecil untuk objek jauh (macam perspektif sebenar).
            const distT = THREE.MathUtils.clamp(displayDistance / CONTROLLER_LASER_MAX_LENGTH, 0, 1);
            const distanceScale = THREE.MathUtils.lerp(1.5, 0.7, distT);
            const flashScale = isFlashing ? 1.3 : 1;
            const markerScale = didHit ? distanceScale * flashScale : 0.55;

            // Tarik penanda sikit ke arah controller (bukan tepat di permukaan) bila
            // kena objek — elak z-fighting/kelipan dengan permukaan tu sekarang
            // depthTest dah aktif. Tak perlu kalau tiada objek dikena.
            const markerDistance = didHit ? Math.max(hitDistance - 0.01, 0.001) : displayDistance;

            const dot = controller.userData.laserDot;
            if (dot) {
                dot.visible = didHit;
                if (didHit) {
                    dot.position.z = -markerDistance;
                    dot.material.color.setHex(hitColor);
                    dot.scale.setScalar(markerScale);
                }
            }
            const ring = controller.userData.laserRing;
            if (ring) {
                ring.visible = didHit;
                if (didHit) {
                    ring.position.z = -markerDistance;
                    ring.material.color.setHex(hitColor);
                    ring.scale.setScalar(markerScale);
                    // Billboard — cincin sentiasa hadap kamera supaya nampak sebagai
                    // reticle tegas dari mana-mana sudut, bukan nipis/hilang dari tepi.
                    mainCamera.getWorldPosition(controllerTempCamPos);
                    ring.lookAt(controllerTempCamPos);
                }
            }

            return hitModel;
        }

        // Guna KHUSUS untuk mula genggam (bukan laser visual/klik) — lihat nota penuh
        // dlm index.html (SENGAJA tiada had CONTROLLER_LASER_MAX_LENGTH — itu cuma
        // clamp panjang visual laser, bukan syarat tolak hit, attempt #16 tersilap
        // tambah had yang tiada dlm logik asal, punca sebenar hit@start kosong).
        function getControllerGrabRaycastHit(controller) {
            controllerTempMatrix.identity().extractRotation(controller.matrixWorld);
            controllerRaycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
            controllerRaycaster.ray.direction.set(0, 0, -1).applyMatrix4(controllerTempMatrix);

            if (loadedModelsList.length === 0) return null;
            const visibleObjects = loadedModelsList.filter(o => o.visible);
            const intersects = controllerRaycaster.intersectObjects(visibleObjects, true);
            for (let i = 0; i < intersects.length; i++) {
                let root = intersects[i].object;
                while (root.parent && root.parent !== scene && root.parent !== contentRoot) {
                    root = root.parent;
                }
                if (root.userData.isGrabbable) return root;
            }
            return null;
        }

        let justReleasedGrab = false;

        // HUD DIAGNOSTIK SEMENTARA — lihat nota penuh dlm index.html. BUANG lepas bug AR
        // grab tap-and-hold ni disahkan selesai.
        const AR_DEBUG_BUILD = '41';
        const arDebug = {
            selectCount: 0, selectStartCount: 0, selectEndCount: 0,
            lastTargetRayMode: undefined, lastHandedness: undefined,
            lastHitOnSelect: null, lastHitOnSelectStart: null,
            pendingMode: null, pendingMaxAngleDeg: 0, pendingMaxDist: 0,
            lastCommitMode: null, lastCommitAt: 0,
            proxyJump: 0, proxyReject: '-', camControllerDist: 0,
            commitObjPos: null, commitCtrlPos: null,
            commitObjLocalPos: null, commitContentRootPos: null, commitContentRootRotDeg: null
        };

        // HUD WebGL (bukan bergantung dom-overlay) — lihat nota penuh dlm index.html.
        const arDebugCanvas = document.createElement('canvas');
        arDebugCanvas.width = 640; arDebugCanvas.height = 320;
        const arDebugCtx = arDebugCanvas.getContext('2d');
        const arDebugTexture = new THREE.CanvasTexture(arDebugCanvas);
        // Panel 0.4m lebar pada 0.4m jarak = ~53° sudut tampak — lihat nota penuh dlm index.html.
        const arDebugSprite = new THREE.Mesh(
            new THREE.PlaneGeometry(0.18, 0.09),
            new THREE.MeshBasicMaterial({ map: arDebugTexture, transparent: true, depthTest: false, depthWrite: false })
        );
        arDebugSprite.renderOrder = 99999;
        arDebugSprite.position.set(-0.12, -0.08, -0.4); // tepi KIRI BAWAH — elak kamera depan/notch telefon
        arDebugSprite.visible = false;
        mainCamera.add(arDebugSprite);

        function updateARDebugHud() {
            const active = isARSession && renderer.xr.isPresenting;
            // dom-overlay BERFUNGSI — lihat nota penuh dlm index.html.
            arDebugSprite.visible = false;
            if (arDebugHud.style.display !== (active ? 'block' : 'none')) {
                arDebugHud.style.display = active ? 'block' : 'none';
            }
            if (!active) return;

            const lines = [
                'AR GRAB DEBUG (build ' + AR_DEBUG_BUILD + ')',
                'start/sel/end: ' + arDebug.selectStartCount + '/' + arDebug.selectCount + '/' + arDebug.selectEndCount,
                'rayMode:' + arDebug.lastTargetRayMode + '  hand:' + arDebug.lastHandedness,
                'hit@start: ' + arDebug.lastHitOnSelectStart,
                'hit@click: ' + arDebug.lastHitOnSelect,
                'pending: ' + (vrPendingGrabCandidate ? arDebug.pendingMode : (arDebug.pendingMode || '-')),
                'maxAngle: ' + arDebug.pendingMaxAngleDeg.toFixed(1) + 'deg  maxDist: ' + arDebug.pendingMaxDist.toFixed(3) + 'm',
                'grabbed: ' + (grabbedObject ? (grabbedObject.name || '(unnamed)') : '-') + '  commit: ' + (arDebug.lastCommitMode || '-'),
                'proxy jump:' + arDebug.proxyJump.toFixed(3) + 'm  ' + arDebug.proxyReject,
                'grabDistance: ' + (grabStartState && grabStartState.arRawController ? grabStartState.arGrabDistance.toFixed(3) + 'm' : '-'),
                'camVsController: ' + arDebug.camControllerDist.toFixed(3) + 'm',
                'obj@commit: ' + (arDebug.commitObjPos ? arDebug.commitObjPos.x.toFixed(2) + ',' + arDebug.commitObjPos.y.toFixed(2) + ',' + arDebug.commitObjPos.z.toFixed(2) : '-'),
                'ctrl@commit: ' + (arDebug.commitCtrlPos ? arDebug.commitCtrlPos.x.toFixed(2) + ',' + arDebug.commitCtrlPos.y.toFixed(2) + ',' + arDebug.commitCtrlPos.z.toFixed(2) : '-'),
                'objLocal: ' + (arDebug.commitObjLocalPos ? arDebug.commitObjLocalPos.x.toFixed(2) + ',' + arDebug.commitObjLocalPos.y.toFixed(2) + ',' + arDebug.commitObjLocalPos.z.toFixed(2) : '-'),
                'rootPos: ' + (arDebug.commitContentRootPos ? arDebug.commitContentRootPos.x.toFixed(2) + ',' + arDebug.commitContentRootPos.y.toFixed(2) + ',' + arDebug.commitContentRootPos.z.toFixed(2) : '-'),
                'rootRotDeg: ' + (arDebug.commitContentRootRotDeg ? arDebug.commitContentRootRotDeg.x.toFixed(0) + ',' + arDebug.commitContentRootRotDeg.y.toFixed(0) + ',' + arDebug.commitContentRootRotDeg.z.toFixed(0) : '-')
            ];

            arDebugHud.textContent = lines.join('\n');

            const ctx = arDebugCtx;
            ctx.clearRect(0, 0, arDebugCanvas.width, arDebugCanvas.height);
            ctx.fillStyle = 'rgba(0,0,0,0.78)';
            ctx.fillRect(0, 0, arDebugCanvas.width, arDebugCanvas.height);
            ctx.fillStyle = '#00ff66';
            ctx.font = '20px monospace';
            lines.forEach((line, i) => ctx.fillText(line, 10, 28 + i * 26));
            arDebugTexture.needsUpdate = true;
        }

        function onControllerSelect(event) {
            if (isARSession) arDebug.selectCount++;

            // Jgn andaikan 'selectend' SEMESTINYA cetus dahulu drpd 'select' — utk
            // transient-pointer (tap skrin AR) susunan tu tak konsisten antara
            // pelaksanaan. Semak grabbedObject SEKARANG (masih di-set kalau 'select'
            // tiba dulu) SERTA justReleasedGrab (di-set kalau 'selectend' dah pun
            // jalan) — dua-dua perlu disemak utk redam onClick lepas drag/genggam,
            // tanpa kira urutan sebenar event ni ditembak oleh runtime WebXR.
            if (grabbedObject) return;
            if (justReleasedGrab) {
                justReleasedGrab = false;
                return;
            }

            if (isARSession && !isPlaced) {
                if (reticle.visible) placeContentAtReticle();
                return;
            }

            const hitModel = getControllerRaycastHit(event.target);
            if (isARSession) arDebug.lastHitOnSelect = hitModel ? (hitModel.name || hitModel.userData.id || '(unnamed)') : '(none)';
            if (hitModel) triggerInteraction(hitModel, 'onClick');
        }
        controller1.addEventListener('select', onControllerSelect);
        controller2.addEventListener('select', onControllerSelect);

        // ---- PICK & PLACE (genggam & alih objek "Boleh Diambil" guna controller) ----
        // Controller KANAN = gerakkan (translate ikut controller, putaran objek dikekalkan)
        // Controller KIRI  = pusingkan (rotate secara local, kedudukan objek dikekalkan)
        let grabbedObject = null;
        let grabStartState = null;
        const _grabTmpVec = new THREE.Vector3();
        const _grabTmpQuat = new THREE.Quaternion();
        const _grabTmpQuat2 = new THREE.Quaternion();

        // GENGGAM + FIZIK — objek "Boleh Diambil" kekal sebagai badan dinamik cannon.js
        // semasa digenggam; mod gerak halakan velocity badan ke sasaran (P-controller
        // dipotong had laju) supaya cuba tarik menembusi objek "Pepejal" disekat oleh
        // pelanggaran fizik sebenar. Bila dilepas, graviti + pelanggaran + bounce
        // (cannon.js) ambil alih terus.
        // Had 20 (bukan 6) — terbukti perlu utk VR, lihat index.html utk nota penuh.
        const GRAB_MAX_SPEED = 20;
        // Nisbah gerak ikut saiz objek (VR, mod 'move' sahaja) — lihat nota penuh dlm
        // index.html. GRAB_GAIN_GRADIENT ialah satu-satunya nombor utk dilaras; kuasa
        // lengkung (1m..CURVE_END) dikira automatik drpd situ supaya sambungan licin.
        const GRAB_GAIN_REFERENCE_SIZE = 1;
        const GRAB_GAIN_CURVE_END = 4;
        const GRAB_GAIN_GRADIENT = 12;
        const GRAB_GAIN_MAX = 300;
        const GRAB_GAIN_CURVE_POWER = Math.log(GRAB_GAIN_GRADIENT * GRAB_GAIN_CURVE_END) / Math.log(GRAB_GAIN_CURVE_END);

        function computeMoveGain(maxDim) {
            if (maxDim <= GRAB_GAIN_REFERENCE_SIZE) return 1;
            const gain = (maxDim <= GRAB_GAIN_CURVE_END) ? Math.pow(maxDim, GRAB_GAIN_CURVE_POWER) : GRAB_GAIN_GRADIENT * maxDim;
            return Math.min(gain, GRAB_GAIN_MAX);
        }
        // blend < 1 kekalkan velocity LAMA (utk jurang yg dah lapuk) bersama yg baru —
        // lepas dtSafe jadi tepat (lihat index.html), ni buat badan overshoot sasaran lalu
        // "patah balik" tiap bingkai (ringing), dirasai sbg "trail"/goyang. Dibuktikan guna
        // replika fizik berasingan. blend=1 (tiada baki momentum lama) hapuskan overshoot.
        const GRAB_VELOCITY_BLEND = 1;
        // AR tap skrin SAHAJA — lihat nota penuh dlm index.html. JANGAN ubah
        // GRAB_VELOCITY_BLEND sendiri (shared dgn VR/desktop).
        const AR_GRAB_VELOCITY_BLEND = 0.3;
        function updateGrabbedObjectTransform(delta) {
            const obj = grabbedObject;
            const st = grabStartState;
            if (!obj || !st) return;
            const controller = st.controller;
            const body = obj.userData._physicsBody;

            if (st.mode === 'rotate') {
                controller.getWorldQuaternion(_grabTmpQuat);
                const deltaQuat = st.controllerWorldQuatInvStart.clone().multiply(_grabTmpQuat);
                const newWorldQuat = st.objWorldQuatStart.clone().multiply(deltaQuat);

                obj.parent.getWorldQuaternion(_grabTmpQuat2);
                obj.quaternion.copy(_grabTmpQuat2.invert().multiply(newWorldQuat));

                if (body) {
                    body.quaternion.set(obj.quaternion.x, obj.quaternion.y, obj.quaternion.z, obj.quaternion.w);
                    body.velocity.set(0, 0, 0);
                    body.angularVelocity.set(0, 0, 0);
                }
            } else {
                controller.getWorldPosition(_grabTmpVec);
                const moveGain = st.moveGain || 1;
                const deltaPos = _grabTmpVec.clone().sub(st.controllerWorldPosStart).multiplyScalar(moveGain);
                const newWorldPos = st.objWorldPosStart.clone().add(deltaPos);
                obj.parent.worldToLocal(newWorldPos);

                // EKSPERIMEN (cadangan Gemini) — lihat amaran penuh dlm index.html.
                if (body && st.arRawController) {
                    body.position.set(newWorldPos.x, newWorldPos.y, newWorldPos.z);
                    body.velocity.set(0, 0, 0);
                    body.angularVelocity.set(0, 0, 0);
                    obj.position.copy(newWorldPos);
                    return;
                }

                if (body) {
                    // Guna delta BINGKAI SEBENAR (bukan floor ke 1/60) — lihat index.html
                    // utk nota penuh (floor lama underestimate kelajuan sasaran di VR ~90Hz).
                    const dtSafe = Math.min(Math.max(delta || 1 / 60, 1 / 240), 1 / 20);
                    const vx = (newWorldPos.x - body.position.x) / dtSafe;
                    const vy = (newWorldPos.y - body.position.y) / dtSafe;
                    const vz = (newWorldPos.z - body.position.z) / dtSafe;
                    const speed = Math.sqrt(vx * vx + vy * vy + vz * vz);
                    // Had kelajuan digandakan sama dgn moveGain — lihat nota index.html.
                    const effMaxSpeed = GRAB_MAX_SPEED * moveGain;
                    const scale = speed > effMaxSpeed ? effMaxSpeed / speed : 1;
                    const velocityBlend = st.arRawController ? AR_GRAB_VELOCITY_BLEND : GRAB_VELOCITY_BLEND;
                    body.velocity.set(
                        THREE.MathUtils.lerp(body.velocity.x, vx * scale, velocityBlend),
                        THREE.MathUtils.lerp(body.velocity.y, vy * scale, velocityBlend),
                        THREE.MathUtils.lerp(body.velocity.z, vz * scale, velocityBlend)
                    );
                    body.angularVelocity.set(0, 0, 0);
                    // Tangkis graviti SEPENUHNYA utk langkah fizik ni selagi digenggam —
                    // lihat index.html untuk nota penuh (objek berehat atas Pepejal rasa
                    // "berat"/x boleh diangkat sebab graviti dibah setiap bingkai hampir
                    // sama magnitud dgn velocity sasaran P-controller bila angkat perlahan).
                    body.applyForce(new CANNON.Vec3(0, -physicsWorld.gravity.y * body.mass, 0), body.position);
                } else {
                    obj.position.copy(newWorldPos);
                }
            }
        }

        // KLIK lwn GENGGAM — lihat nota penuh dlm index.html.
        let vrPendingGrabCandidate = null;
        const VR_GRAB_POS_THRESHOLD = 0.03;
        const VR_GRAB_ANGLE_THRESHOLD = 0.08;
        // AR tap skrin (mod 'move'): threshold jauh lebih kecil drpd VR wrist-rotation —
        // lihat nota penuh dlm index.html.
        const AR_SCREEN_GRAB_ANGLE_THRESHOLD = 0.0175;
        // Ambang MASA minimum (ms) — lihat nota penuh dlm index.html.
        const AR_SCREEN_GRAB_MIN_HOLD_MS = 180;

        // AR (tap skrin telefon): proksi JARAK-TETAP KHUSUS utk mod 'move' — lihat nota
        // penuh dlm index.html. (Pendekatan ray-plane asal dibuang selepas 7 percubaan
        // #21-#27 gagal dapatkan bacaan arah kamera yang boleh dipercayai setiap bingkai —
        // teknik jarak-tetap ni cuma guna ray controller sendiri, terbukti betul via laser.)
        function computeARGrabDistance(rawController, objWorldPos) {
            const rayOrigin = new THREE.Vector3();
            rawController.getWorldPosition(rayOrigin);
            const proxy = new THREE.Object3D();
            proxy.position.copy(objWorldPos);
            // EKSPERIMEN (cadangan Gemini) — lihat nota penuh dlm index.html.
            const dist = Math.max(rayOrigin.distanceTo(objWorldPos), 0.3);
            return { proxy, distance: dist };
        }

        // Tapis gegaran — lihat nota penuh dlm index.html.
        const AR_GRAB_PROXY_SMOOTHING = 0.35;
        const AR_GRAB_MAX_JUMP_PER_FRAME = 1.5;
        const _arRayOrigin = new THREE.Vector3();
        const _arRayDir = new THREE.Vector3();
        const _arHitPoint = new THREE.Vector3();
        const _arCamPos = new THREE.Vector3();
        const _arMat = new THREE.Matrix4();
        function updateARGrabProxy(st) {
            st.arRawController.getWorldPosition(_arRayOrigin);
            // EKSPERIMEN (cadangan Gemini) — lihat nota penuh dlm index.html.
            _arMat.identity().extractRotation(st.arRawController.matrixWorld);
            _arRayDir.set(0, 0, -1).applyMatrix4(_arMat).normalize();
            _arHitPoint.copy(_arRayOrigin).addScaledVector(_arRayDir, st.arGrabDistance);

            // DIAGNOSTIK — lihat nota penuh dlm index.html.
            mainCamera.getWorldPosition(_arCamPos);
            arDebug.camControllerDist = _arCamPos.distanceTo(_arRayOrigin);

            const jump = _arHitPoint.distanceTo(st.controller.position);
            arDebug.proxyJump = jump;
            // EKSPERIMEN (cadangan Gemini) — snap terus, bukan tolak. Lihat amaran penuh
            // dlm index.html: grabDistance masih DISAHKAN salah (~7-8m).
            if (jump > AR_GRAB_MAX_JUMP_PER_FRAME) {
                st.controller.position.copy(_arHitPoint);
                arDebug.proxyReject = 'snap';
                return;
            }
            arDebug.proxyReject = 'ok';
            st.controller.position.lerp(_arHitPoint, AR_GRAB_PROXY_SMOOTHING);
        }

        function commitVRGrab(pending) {
            const { hitModel, controller, mode } = pending;
            grabbedObject = hitModel;

            const bodyToWake = hitModel.userData._physicsBody;
            if (bodyToWake && bodyToWake.type === CANNON.Body.STATIC) {
                bodyToWake.type = CANNON.Body.DYNAMIC;
                bodyToWake.mass = 1;
                bodyToWake.updateMassProperties();
                bodyToWake.velocity.set(0, 0, 0);
                bodyToWake.angularVelocity.set(0, 0, 0);
            }

            // Lumpuhkan damping sementara semasa digenggam — lihat nota penuh dlm index.html
            // (damping 0.2/0.4 terpakai setiap sub-langkah fizik dalaman, bukan setiap
            // bingkai render; di VR ~90Hz ia boleh termampat 2x antara kemaskini kita,
            // punca "berat/bergerak sikit" dlm semua arah). Pulih bila lepas (selectEnd).
            let prevLinearDamping = null, prevAngularDamping = null;
            if (bodyToWake) {
                prevLinearDamping = bodyToWake.linearDamping;
                prevAngularDamping = bodyToWake.angularDamping;
                bodyToWake.linearDamping = 0;
                bodyToWake.angularDamping = 0;
            }

            const objWorldPosStart = new THREE.Vector3();
            const objWorldQuatStart = new THREE.Quaternion();
            hitModel.getWorldPosition(objWorldPosStart);
            hitModel.getWorldQuaternion(objWorldQuatStart);

            // Kotak sempadan SEBENAR (bukan pivot Object3D) — lihat nota penuh dlm index.html.
            const objBox = new THREE.Box3().setFromObject(hitModel);
            const objVisualCenter = objBox.getCenter(new THREE.Vector3());
            const objSize = objBox.getSize(new THREE.Vector3());

            // AR mod 'move' — lihat nota penuh dlm index.html.
            let arGrabDistance = null, arRawController = null;
            let effectiveController = controller;
            // HANYA utk 'screen' (tap tanpa jejak kedudukan) — lihat index.html.
            if (isARSession && mode === 'move' && controller.userData.targetRayMode === 'screen') {
                const { proxy, distance } = computeARGrabDistance(controller, objVisualCenter);
                arGrabDistance = distance;
                arRawController = controller;
                effectiveController = proxy;
                // DIAGNOSTIK — lihat nota penuh dlm index.html.
                const ctrlPosNow = new THREE.Vector3();
                controller.getWorldPosition(ctrlPosNow);
                arDebug.commitObjPos = objVisualCenter.clone();
                arDebug.commitCtrlPos = ctrlPosNow;
                // DIAGNOSTIK — lihat nota penuh dlm index.html.
                arDebug.commitObjLocalPos = hitModel.position.clone();
                arDebug.commitContentRootPos = contentRoot.position.clone();
                arDebug.commitContentRootRotDeg = new THREE.Vector3(
                    THREE.MathUtils.radToDeg(contentRoot.rotation.x),
                    THREE.MathUtils.radToDeg(contentRoot.rotation.y),
                    THREE.MathUtils.radToDeg(contentRoot.rotation.z)
                );
            }

            const controllerWorldPosStart = new THREE.Vector3();
            const controllerWorldQuatInvStart = new THREE.Quaternion();
            effectiveController.getWorldPosition(controllerWorldPosStart);
            effectiveController.getWorldQuaternion(controllerWorldQuatInvStart).invert();

            const moveGain = arGrabDistance !== null ? 1 : computeMoveGain(Math.max(objSize.x, objSize.y, objSize.z));

            grabStartState = {
                mode,
                controller: effectiveController,
                objWorldPosStart,
                objWorldQuatStart,
                controllerWorldPosStart,
                controllerWorldQuatInvStart,
                prevLinearDamping,
                prevAngularDamping,
                moveGain,
                arGrabDistance,
                arRawController
            };
        }

        // Lihat nota penuh dlm index.html.
        function tryCreateGrabCandidate(controller) {
            if (grabbedObject || vrPendingGrabCandidate) return false;

            const hitModel = getControllerGrabRaycastHit(controller);
            if (isARSession) arDebug.lastHitOnSelectStart = hitModel ? (hitModel.name || hitModel.userData.id || '(unnamed)') : '(tiada hit grabbable)';
            if (!hitModel) return false;

            const mode = controller.userData.handedness === 'left' ? 'rotate' : 'move';
            const startWorldPos = new THREE.Vector3();
            const startWorldQuat = new THREE.Quaternion();
            controller.getWorldPosition(startWorldPos);
            controller.getWorldQuaternion(startWorldQuat);

            if (isARSession) { arDebug.pendingMode = mode; arDebug.pendingMaxAngleDeg = 0; arDebug.pendingMaxDist = 0; }
            vrPendingGrabCandidate = { hitModel, controller, mode, startWorldPos, startWorldQuat, startTime: performance.now() };
            return true;
        }

        function onControllerSelectStart(event) {
            if (isARSession) {
                arDebug.selectStartCount++;
                arDebug.lastTargetRayMode = event.target.userData.targetRayMode;
                arDebug.lastHandedness = event.target.userData.handedness;
            }
            if (grabbedObject || vrPendingGrabCandidate) {
                if (isARSession) arDebug.lastHitOnSelectStart = '(skip: ' + (grabbedObject ? 'dah genggam' : 'dah pending') + ')';
                return;
            }
            if (isARSession && !isPlaced) {
                arDebug.lastHitOnSelectStart = '(skip: belum placed)';
                return;
            }

            const controller = event.target;
            const created = tryCreateGrabCandidate(controller);
            if (!created && isARSession && controller.userData.targetRayMode === 'screen') {
                controller.userData.arTouchAwaitingHit = true;
            }
        }

        // Lihat nota penuh dlm index.html.
        function checkARTouchAwaitingGrab() {
            if (!isARSession || grabbedObject || vrPendingGrabCandidate) return;
            [controller1, controller2].forEach(ctrl => {
                if (!ctrl.userData.arTouchAwaitingHit) return;
                if (grabbedObject || vrPendingGrabCandidate) return;
                if (tryCreateGrabCandidate(ctrl)) ctrl.userData.arTouchAwaitingHit = false;
            });
        }

        function checkVRPendingGrabCommit() {
            const pending = vrPendingGrabCandidate;
            if (!pending) return;
            const { controller, mode, startWorldPos, startWorldQuat } = pending;

            // AR tap skrin — guna threshold SUDUT gantian threshold jarak; lihat nota
            // penuh dlm index.html.
            const useAngleThreshold = mode === 'rotate' ||
                (isARSession && mode === 'move' && controller.userData.targetRayMode === 'screen');

            if (isARSession) {
                const qDbg = new THREE.Quaternion();
                controller.getWorldQuaternion(qDbg);
                const angleDbg = 2 * Math.acos(THREE.MathUtils.clamp(Math.abs(startWorldQuat.dot(qDbg)), -1, 1));
                arDebug.pendingMaxAngleDeg = Math.max(arDebug.pendingMaxAngleDeg, angleDbg * 180 / Math.PI);
                const pDbg = new THREE.Vector3();
                controller.getWorldPosition(pDbg);
                arDebug.pendingMaxDist = Math.max(arDebug.pendingMaxDist, pDbg.distanceTo(startWorldPos));
            }

            if (useAngleThreshold) {
                const isARScreenMove = isARSession && mode === 'move' && controller.userData.targetRayMode === 'screen';
                const angleThreshold = isARScreenMove ? AR_SCREEN_GRAB_ANGLE_THRESHOLD : VR_GRAB_ANGLE_THRESHOLD;
                const q = new THREE.Quaternion();
                controller.getWorldQuaternion(q);
                const angle = 2 * Math.acos(THREE.MathUtils.clamp(Math.abs(startWorldQuat.dot(q)), -1, 1));
                if (angle < angleThreshold) return;
                // Ambang masa minimum SERTA dgn sudut — lihat nota penuh dlm index.html.
                if (isARScreenMove && (performance.now() - pending.startTime) < AR_SCREEN_GRAB_MIN_HOLD_MS) return;
            } else {
                const p = new THREE.Vector3();
                controller.getWorldPosition(p);
                if (p.distanceTo(startWorldPos) < VR_GRAB_POS_THRESHOLD) return;
            }

            vrPendingGrabCandidate = null;
            if (isARSession) { arDebug.lastCommitMode = mode; arDebug.lastCommitAt = performance.now(); }
            commitVRGrab(pending);
        }

        // ZON SASARAN — semak sama ada objek yang baru dilepas jatuh dalam mana-mana
        // zon yang memantaunya (zon & objek sama-sama anak terus contentRoot, jadi
        // position/quaternion boleh dibanding terus, tak perlu tukar ruang koordinat).
        function checkPlacementZones(droppedObject) {
            let docked = false;

            loadedModelsList.forEach(zoneObj => {
                if (zoneObj.userData.primType !== 'zone' || !zoneObj.userData.interactions) return;

                const matches = zoneObj.userData.interactions.filter(act =>
                    act.trigger === 'onPlaceInZone' &&
                    Array.isArray(act.watchObjectIds) &&
                    act.watchObjectIds.some(wid => wid == droppedObject.userData.id)
                );
                if (matches.length === 0) return;

                const zoneBox = new THREE.Box3().setFromObject(zoneObj);
                const objBox = new THREE.Box3().setFromObject(droppedObject);
                const isColliding = zoneBox.intersectsBox(objBox);
                const isFullyInside = isColliding && zoneBox.containsBox(objBox);

                const satisfied = matches.some(act =>
                    act.zoneTriggerMode === 'fullyInside' ? isFullyInside : isColliding
                );
                if (!satisfied) return;

                droppedObject.position.copy(zoneObj.position);
                droppedObject.quaternion.copy(zoneObj.quaternion);

                const dockedBody = droppedObject.userData._physicsBody;
                if (dockedBody) {
                    dockedBody.position.set(zoneObj.position.x, zoneObj.position.y, zoneObj.position.z);
                    dockedBody.quaternion.set(zoneObj.quaternion.x, zoneObj.quaternion.y, zoneObj.quaternion.z, zoneObj.quaternion.w);
                    dockedBody.velocity.set(0, 0, 0);
                    dockedBody.angularVelocity.set(0, 0, 0);
                    dockedBody.type = CANNON.Body.STATIC;
                    dockedBody.mass = 0;
                    dockedBody.updateMassProperties();
                }

                triggerInteraction(zoneObj, 'onPlaceInZone');
                docked = true;
            });

            return docked;
        }

        // KEMBALIKAN OBJEK KE KEDUDUKAN/PUTARAN ASAL (bila "returnToOriginalOnRelease").
        function returnObjectToOriginalTransform(obj) {
            obj.position.copy(obj.userData.initialPosition);
            obj.quaternion.setFromEuler(obj.userData.initialRotation);

            const body = obj.userData._physicsBody;
            if (body) {
                body.position.set(obj.position.x, obj.position.y, obj.position.z);
                body.quaternion.set(obj.quaternion.x, obj.quaternion.y, obj.quaternion.z, obj.quaternion.w);
                body.velocity.set(0, 0, 0);
                body.angularVelocity.set(0, 0, 0);
            }
        }

        // ZON KEHADIRAN PENGGUNA — semak setiap bingkai sama ada kamera (pengguna sendiri)
        // baru masuk ke dalam mana-mana Zon Sasaran yang ada trigger "onUserEnterZone"
        // (wayfinding: pengguna sampai satu blok/titik -> tukar scene). Dicetus SEKALI
        // sahaja pada peralihan luar->dalam (edge-triggered).
        function checkUserZoneEntryTriggers() {
            const camPos = new THREE.Vector3();
            mainCamera.getWorldPosition(camPos);

            loadedModelsList.forEach(zoneObj => {
                if (zoneObj.userData.primType !== 'zone' || !zoneObj.userData.interactions) return;
                const hasEnterTrigger = zoneObj.userData.interactions.some(act => act.trigger === 'onUserEnterZone');
                if (!hasEnterTrigger) return;

                const zoneBox = new THREE.Box3().setFromObject(zoneObj);
                const isInside = zoneBox.containsPoint(camPos);
                const wasInside = !!zoneObj.userData._userInsideZone;
                zoneObj.userData._userInsideZone = isInside;

                if (isInside && !wasInside) {
                    triggerInteraction(zoneObj, 'onUserEnterZone');
                }
            });
        }

        function onControllerSelectEnd(event) {
            if (isARSession) arDebug.selectEndCount++;
            if (event && event.target) event.target.userData.arTouchAwaitingHit = false;

            if (vrPendingGrabCandidate && (!event || vrPendingGrabCandidate.controller === event.target)) {
                if (isARSession) arDebug.pendingMode = '(klik — threshold x tercapai)';
                vrPendingGrabCandidate = null;
                return;
            }
            if (!grabbedObject) return;

            const obj = grabbedObject;
            const mode = grabStartState ? grabStartState.mode : 'move';

            const releasedBody = obj.userData._physicsBody;
            if (releasedBody && grabStartState && grabStartState.prevLinearDamping !== null) {
                releasedBody.linearDamping = grabStartState.prevLinearDamping;
                releasedBody.angularDamping = grabStartState.prevAngularDamping;
            }

            let docked = false;
            if (mode === 'move') {
                docked = checkPlacementZones(obj);
            }

            if (!docked && obj.userData.returnToOriginalOnRelease) {
                returnObjectToOriginalTransform(obj);
            }

            grabbedObject = null;
            grabStartState = null;
            justReleasedGrab = true;
        }

        controller1.addEventListener('selectstart', onControllerSelectStart);
        controller1.addEventListener('selectend', onControllerSelectEnd);
        controller2.addEventListener('selectstart', onControllerSelectStart);
        controller2.addEventListener('selectend', onControllerSelectEnd);

        // GENGGAM GUNA MOUSE (desktop/bukan sesi XR — termasuk fallback "View tanpa AR/VR"
        // bila peranti tak sokong WebXR, sebab mod tu pun guna laluan mouse yang sama).
        // AR (tap di skrin telefon): laluan onControllerSelectStart/End di atas, TAPI guna
        // proksi jarak-tetap (computeARGrabDistance/updateARGrabProxy) utk mod 'move' —
        // lihat nota penuh dlm index.html (kedudukan controller "transient-pointer" tak
        // boleh dipercayai utk translate terus macam VR hand controller).
        const mouseGrabProxy = new THREE.Object3D();
        const mouseGrabPlane = new THREE.Plane();
        const mouseGrabPlaneNormal = new THREE.Vector3();
        let isMouseGrabbing = false;
        let pendingGrabCandidate = null; // {hitModel, point} — ditetapkan di pointerdown, disahkan di pointermove

        function startMouseGrab(hitModel, grabPoint) {
            grabbedObject = hitModel;
            controls.enabled = false;

            const bodyToWake = hitModel.userData._physicsBody;
            if (bodyToWake && bodyToWake.type === CANNON.Body.STATIC) {
                bodyToWake.type = CANNON.Body.DYNAMIC;
                bodyToWake.mass = 1;
                bodyToWake.updateMassProperties();
                bodyToWake.velocity.set(0, 0, 0);
                bodyToWake.angularVelocity.set(0, 0, 0);
            }

            // Lumpuhkan damping sementara semasa digenggam — lihat nota dlm index.html.
            let prevLinearDamping = null, prevAngularDamping = null;
            if (bodyToWake) {
                prevLinearDamping = bodyToWake.linearDamping;
                prevAngularDamping = bodyToWake.angularDamping;
                bodyToWake.linearDamping = 0;
                bodyToWake.angularDamping = 0;
            }

            mainCamera.getWorldDirection(mouseGrabPlaneNormal);
            mouseGrabPlane.setFromNormalAndCoplanarPoint(mouseGrabPlaneNormal, grabPoint);
            mouseGrabProxy.position.copy(grabPoint);
            mouseGrabProxy.quaternion.identity();

            const objWorldPosStart = new THREE.Vector3();
            const objWorldQuatStart = new THREE.Quaternion();
            hitModel.getWorldPosition(objWorldPosStart);
            hitModel.getWorldQuaternion(objWorldQuatStart);

            const controllerWorldPosStart = new THREE.Vector3();
            const controllerWorldQuatInvStart = new THREE.Quaternion();
            mouseGrabProxy.getWorldPosition(controllerWorldPosStart);
            mouseGrabProxy.getWorldQuaternion(controllerWorldQuatInvStart).invert();

            grabStartState = {
                mode: 'move',
                controller: mouseGrabProxy,
                objWorldPosStart,
                objWorldQuatStart,
                controllerWorldPosStart,
                controllerWorldQuatInvStart,
                prevLinearDamping,
                prevAngularDamping,
                // SENGAJA eksplisit null — lihat nota penuh dlm index.html (bug sebenar
                // 2026-10-29: undefined !== null jadi TRUE, updateARGrabProxy terpanggil
                // utk mouse-grab & crash — app "hang").
                arGrabDistance: null,
                arRawController: null
            };

            isMouseGrabbing = true;
        }

        // ---------------------------------------------------------------
        // SESI WEBXR (VR/AR) — reposisi kamera & urus latar passthrough
        // ---------------------------------------------------------------
        let savedSceneBackgroundForAR = null;

        renderer.xr.addEventListener('sessionstart', () => {
            const session = renderer.xr.getSession();
            const blendMode = session && session.environmentBlendMode;
            isARSession = !!(blendMode && blendMode !== 'opaque');

            if (isARSession) {
                // MOD AR: jangan papar kandungan dulu — tunggu pengguna tap-to-place.
                // Kamera TIDAK digerakkan (kekal ikut tracking peranti sebenar); yang
                // digerakkan ialah contentRoot, ke titik hit-test yang ditap.
                isPlaced = false;
                hitTestSourceRequested = false;
                hitTestSource = null;
                reticle.visible = false;
                contentRoot.position.set(0, 0, 0);
                contentRoot.quaternion.identity();
                loadedModelsList.forEach(m => { m.visible = false; });

                savedSceneBackgroundForAR = scene.background;
                scene.background = null;
            } else {
                // MOD VR: kekal gelagat asal — kamera diletak di Kedudukan Awal Kamera scene.
                applyVisibilityAndCamera();
            }
        });
        renderer.xr.addEventListener('sessionend', () => {
            cameraRig.position.set(0, 0, 0);
            cameraRig.rotation.set(0, 0, 0);
            contentRoot.position.set(0, 0, 0);
            contentRoot.quaternion.identity();

            isARSession = false;
            isPlaced = false;
            hitTestSource = null;
            hitTestSourceRequested = false;
            reticle.visible = false;

            if (savedSceneBackgroundForAR !== null) {
                scene.background = savedSceneBackgroundForAR;
                savedSceneBackgroundForAR = null;
            }

            applyVisibilityAndCamera();
        });

        // ---------------------------------------------------------------
        // ANIMATE LOOP
        // ---------------------------------------------------------------
        function animate(timestamp, frame) {
            const delta = clock.getDelta();

            if (!renderer.xr.isPresenting) {
                controls.update();
            }

            // ALIRAN ANAK PANAH LALUAN WAYPOINT
            if (waypointPathMeshes.length > 0) {
                waypointArrowTexture.offset.x -= delta * WAYPOINT_PATH_SCROLL_SPEED;
            }

            // "Pengguna masuk zon" cuma bermakna bila kamera = kedudukan sebenar
            // pengguna di dunia nyata (sesi AR/VR sebenar sedang presenting). Dalam
            // mod 3D biasa (orbit ikut tetikus), kamera tak mewakili kedudukan
            // sebenar pengguna — check di sini akan tercetus tanpa diingini bila
            // kamera orbit "lalu" dekat zon semasa drag rotate.
            if (renderer.xr.isPresenting) {
                checkUserZoneEntryTriggers();
            }

            // TAP-TO-PLACE (hit-test) — hanya semasa AR aktif & belum diletak lagi.
            // Scene boleh tanda "Auto Letak AR" (arAutoPlace) untuk skip terus tanpa tunggu tap.
            if (renderer.xr.isPresenting && isARSession && !isPlaced && arAutoPlace) {
                placeContentAtDefault();
            } else if (renderer.xr.isPresenting && isARSession && !isPlaced && frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (!hitTestSourceRequested) {
                    hitTestSourceRequested = true;

                    if (session.requestHitTestSource) {
                        session.requestReferenceSpace('viewer').then((viewerSpace) => {
                            session.requestHitTestSource({ space: viewerSpace }).then((source) => {
                                hitTestSource = source;
                            }).catch(() => placeContentAtDefault());
                        }).catch(() => placeContentAtDefault());

                        session.addEventListener('end', () => {
                            hitTestSourceRequested = false;
                            hitTestSource = null;
                        });
                    } else {
                        // Peranti/browser tak sokong hit-test langsung
                        placeContentAtDefault();
                    }
                }

                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    if (hitTestResults.length > 0) {
                        const pose = hitTestResults[0].getPose(referenceSpace);
                        if (pose) {
                            reticle.visible = true;
                            reticle.matrix.fromArray(pose.transform.matrix);
                        }
                    } else {
                        reticle.visible = false;
                    }
                }
            } else if (!isPlaced) {
                reticle.visible = false;
            }

            checkARTouchAwaitingGrab();
            checkVRPendingGrabCommit();

            // HUD DIAGNOSTIK SEMENTARA — lihat nota penuh dekat deklarasi `arDebug`/
            // `updateARDebugHud` di atas. BUANG lepas bug AR grab ni disahkan selesai.
            updateARDebugHud();

            if (grabbedObject && grabStartState && grabStartState.arRawController) {
                updateARGrabProxy(grabStartState);
            }

            if (grabbedObject) {
                updateGrabbedObjectTransform(delta);
            } else if (renderer.xr.isPresenting) {
                const vrHit1 = getControllerRaycastHit(controller1);
                const vrHit2 = getControllerRaycastHit(controller2);
                const vrHit = vrHit1 || vrHit2;
                if (vrHit !== hoveredModel) {
                    hoveredModel = vrHit;
                    if (hoveredModel) triggerInteraction(hoveredModel, 'onHover');
                }
            }

            // FIZIK (graviti/pelanggaran/bounce) — tunggu content diletak dulu dalam AR.
            if (physicsActive && (!isARSession || isPlaced)) {
                updateCutoutCameraGating();
                syncPhysicsBodiesWithVisibility();
                if (grabbedObject) {
                    // Semasa genggam, guna delta bingkai SEBENAR (satu langkah tepat, tiada
                    // accumulator/skip) supaya objek 1:1 ikut kelajuan kursor/controller —
                    // lihat nota penuh dlm index.html.
                    physicsWorld.step(Math.min(delta || 1 / 60, 1 / 20));
                } else {
                    physicsWorld.step(1 / 60, delta, 10);
                }
                physicsBodies.forEach(pb => {
                    if (!pb.inWorld) return;
                    if (pb.body.type !== CANNON.Body.STATIC) {
                        pb.mesh.position.copy(pb.body.position);
                        pb.mesh.quaternion.copy(pb.body.quaternion);
                    }
                });
            }

            loadedModelsList.forEach(m => {
                if (m.userData.mixer && m.userData.animAction && (m.userData.animState === 'playing' || m.userData.animState === 'playing_fwd' || m.userData.animState === 'playing_rev')) {
                    const action = m.userData.animAction;
                    const startTime = m.userData.customStartTime || 0;
                    const endTime = m.userData.customEndTime || action.getClip().duration;
                    const dir = m.userData.animDir || 'forward';

                    if (action.timeScale > 0 && action.time >= endTime) {
                        if (dir === 'pingpong') {
                            action.timeScale = -1;
                        } else if (m.userData.interactions) {
                            const act = m.userData.interactions.find(a => a.action === 'toggleModelAnim');
                            if (act && act.animMode === 'toggleReverse') {
                                action.paused = true;
                                action.time = endTime;
                                m.userData.animState = 'atEnd';
                            } else if (act && act.animMode === 'once') {
                                action.paused = true;
                                action.time = endTime;
                                m.userData.animState = 'stopped';
                            } else {
                                action.time = startTime;
                            }
                        }
                    }
                    else if (action.timeScale < 0 && action.time <= startTime) {
                        if (dir === 'pingpong') {
                            action.timeScale = 1;
                        } else if (m.userData.interactions) {
                            const act = m.userData.interactions.find(a => a.action === 'toggleModelAnim');
                            if (act && act.animMode === 'toggleReverse') {
                                action.paused = true;
                                action.time = startTime;
                                m.userData.animState = 'atStart';
                            } else if (act && act.animMode === 'once') {
                                action.paused = true;
                                action.time = startTime;
                                m.userData.animState = 'stopped';
                            } else {
                                action.time = endTime;
                            }
                        }
                    }

                    m.userData.mixer.update(delta);
                }

                if (m.userData.isRotating) {
                    m.rotation.y += 0.01;
                }
            });

            renderer.render(scene, mainCamera);
        }
        renderer.setAnimationLoop(animate);

        window.addEventListener('resize', () => {
            if (renderer.xr.isPresenting) return;
            mainCamera.aspect = container.clientWidth / container.clientHeight;
            mainCamera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // ---------------------------------------------------------------
        // MUAT PROJEK DARI SUPABASE (ikut ?project=<id> dalam URL)
        // ---------------------------------------------------------------
        async function loadPublicProject(projectId) {
            const { data, error } = await supabaseClient
                .from('projects')
                .select('id,name,data,is_public')
                .eq('id', projectId)
                .single();

            if (error || !data) {
                showStatus('❌ Project Not Found', 'This project does not exist, or the link is invalid.', true);
                return;
            }

            if (!data.is_public) {
                showStatus('🔒 Private Project', 'The owner of this project has not made it public yet. Ask the owner to enable "Public" status to share this link.', true);
                return;
            }

            const projectData = data.data || {};
            fullScenesData = projectData.scenes || [];

            if (fullScenesData.length === 0) {
                showStatus('📭 Empty Project', 'This project has no content yet.', true);
                return;
            }

            (projectData.audios || []).forEach(a => {
                uploadedAudios[a.fileName] = a.url;
            });

            const badge = document.getElementById('project-badge');
            badge.innerText = '📁 ' + (data.name || 'Project');
            badge.style.display = 'block';

            // Scene PERTAMA dalam senarai sentiasa jadi default (sama macam mod Pratonton editor)
            const firstScene = fullScenesData[0];
            activeSceneId = firstScene.id;
            await applySceneDataToViewport(firstScene);

            hideStatus();
        }

        // FAIL EKSPORT BERDIRI SENDIRI (standalone .html) — editor (index.html) boleh
        // "bake" data projek (dengan semua asset ditukar jadi data URI base64) terus ke
        // dalam fail ni sebagai window.__EMBEDDED_PROJECT__, supaya fail ni boleh jalan
        // 100% offline/dari server sendiri pengguna, tanpa panggil Supabase langsung.
        async function loadEmbeddedProject(projectRow) {
            const projectData = projectRow.data || {};
            fullScenesData = projectData.scenes || [];

            if (fullScenesData.length === 0) {
                showStatus('📭 Empty Project', 'This project has no content yet.', true);
                return;
            }

            (projectData.audios || []).forEach(a => {
                uploadedAudios[a.fileName] = a.url;
            });

            const badge = document.getElementById('project-badge');
            badge.innerText = '📁 ' + (projectRow.name || 'Project');
            badge.style.display = 'block';

            const firstScene = fullScenesData[0];
            activeSceneId = firstScene.id;
            await applySceneDataToViewport(firstScene);

            hideStatus();
        }

        const urlParams = new URLSearchParams(window.location.search);
        const projectIdParam = urlParams.get('project');

        if (window.__EMBEDDED_PROJECT__) {
            loadEmbeddedProject(window.__EMBEDDED_PROJECT__);
        } else if (!projectIdParam) {
            showStatus('⚠️ No Project Specified', 'This link is incomplete — please use the link/QR provided by the project creator.', true);
        } else {
            loadPublicProject(projectIdParam);
        }
    </script>
</body>
</html>
