<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR PdP Viewer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        html, body { overflow: hidden; background-color: #1a1a1a; color: white; height: 100%; width: 100%; }
        #canvas-container { position: relative; height: 100%; width: 100%; overflow: hidden; }

        #status-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 10, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            text-align: center;
            padding: 20px;
        }
        #status-overlay .box { max-width: 340px; }
        #status-overlay h2 { font-size: 16px; color: #007acc; margin-bottom: 10px; }
        #status-overlay p { font-size: 12px; color: #aaa; line-height: 1.6; }
        #status-overlay.error h2 { color: #d9534f; }

        #project-badge {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.85);
            padding: 6px 16px;
            border-radius: 8px;
            border: 1px solid #444;
            font-size: 12px;
            color: #eee;
            z-index: 20;
            display: none;
        }

        #info-popup {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 10px 18px;
            border-radius: 8px;
            border: 2px solid #007acc;
            font-size: 14px;
            font-weight: bold;
            display: none;
            z-index: 30;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            pointer-events: none;
            max-width: 280px;
        }
        #info-popup .info-popup-title { font-size: 14px; font-weight: bold; color: #ffcc00; margin-bottom: 3px; }
        #info-popup .info-popup-content { font-size: 13px; font-weight: normal; color: #fff; }
    </style>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <!-- THREE.JS + CANNON-ES -->
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.min.js"></script>
    <!-- THREE.JS + CANNON-ES kini dimuat sebagai ES module (sama pattern dgn index.html) —
         importmap ni bagi tahu browser mana nak cari bare specifier 'three' / 'three/addons/'
         / 'cannon-es'. Ini membolehkan view.html import terus fail js/ yang SAMA dengan
         index.html (physics, occluder, grab, controller-visuals, dll) — satu sumber
         kebenaran, bukan dua kopi yang boleh drift. cannon.js (0.6.2) klasik digantikan dgn
         cannon-es (fork ESM diselenggara, API serasi) — tiada build UMD/global, jadi MESTI
         lalui importmap ni. Lihat js/services/exporter.js untuk macam mana eksport "Export
         HTML" tetap kekal 100% offline walau view.html kini guna CDN ESM sepenuhnya. -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/",
            "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
        }
    }
    </script>
</head>
<body>

    <div id="status-overlay">
        <div class="box">
            <h2 id="status-title">⏳ Loading Project...</h2>
            <p id="status-text">Please wait a moment.</p>
        </div>
    </div>

    <div id="canvas-container">
        <div id="project-badge"></div>
        <div id="info-popup"></div>

        <!-- HUD DIAGNOSTIK SEMENTARA — lihat nota penuh dlm index.html. BUANG lepas bug AR
        grab tap-and-hold ni disahkan selesai. -->
        <div id="ar-debug-hud" style="display:none; position:fixed; bottom:8px; left:8px; z-index:99999; background:rgba(0,0,0,0.75); color:#0f0; font:11px monospace; padding:6px 8px; border-radius:4px; max-width:80vw; white-space:pre-wrap; pointer-events:none;"></div>
    </div>

    <script type="module">
        import * as THREE_NS from 'three';
        import * as CANNON_NS from 'cannon-es';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { physicsWorld } from './js/physics/world.js';
        import { createOccluder } from './js/physics/occluder.js';
        import { createColliders } from './js/physics/colliders.js';
        import { appState } from './js/core/state.js';
        import { createXRButton } from './js/core/xr-session.js';
        import { createSceneUtils } from './js/core/scene.js';
        import { createControllerVisuals } from './js/ui/controller-visuals.js';
        import { createArDebugHud, arDebug } from './js/ui/ar-debug-hud.js';
        import { createWaypoint } from './js/interactions/waypoint.js';
        import {
            VR_GRAB_POS_THRESHOLD, VR_GRAB_ANGLE_THRESHOLD,
            computeMoveGain, buildGrabStartState, createGrabCore
        } from './js/interactions/grab-core.js';
        import {
            AR_SCREEN_GRAB_ANGLE_THRESHOLD, AR_SCREEN_GRAB_MIN_HOLD_MS, AR_GRAB_VELOCITY_BLEND,
            createArGrab
        } from './js/interactions/grab-ar.js';
        import { createPointerGrab } from './js/interactions/pointer-grab.js';

        // Jambatan ESM -> gaya THREE.XXX sedia ada (sama pattern dgn index.html). view.html
        // tak perlukan TransformControls (editor-only, tiada gizmo di sini).
        const THREE = { ...THREE_NS, OrbitControls, GLTFLoader, FBXLoader, RoomEnvironment };
        window.THREE = THREE;

        // Jambatan sama utk CANNON (cannon-es) — colliders.js/grab-core.js/pointer-grab.js
        // dan fungsi trigger/grab inline bawah ni rujuk `CANNON.xxx` sbg GLOBAL (bukan
        // parameter factory), warisan dari <script src=".../cannon.min.js"> klasik dulu.
        // Selamat dari segi timing (lihat nota penuh dlm index.html) — js/physics/world.js
        // sendiri import terus 'cannon-es', tak bergantung pada jambatan ni.
        window.CANNON = CANNON_NS;

        // ---------------------------------------------------------------
        // SUPABASE (baca sahaja — projek awam)
        // ---------------------------------------------------------------
        const SUPABASE_URL = 'https://jmuraizgowqwmpmetupu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_DZ8vjKrIJhXM34D7ddS6dw_nlIL18YD';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function showStatus(title, text, isError) {
            const overlay = document.getElementById('status-overlay');
            overlay.style.display = 'flex';
            overlay.className = isError ? 'error' : '';
            document.getElementById('status-title').innerText = title;
            document.getElementById('status-text').innerText = text;
        }

        function hideStatus() {
            document.getElementById('status-overlay').style.display = 'none';
        }

        // ---------------------------------------------------------------
        // THREE.JS SETUP
        // ---------------------------------------------------------------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const mainCamera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
        mainCamera.position.set(3, 4, 5);

        const cameraRig = new THREE.Object3D();
        cameraRig.name = 'CameraRig';
        cameraRig.add(mainCamera);
        scene.add(cameraRig);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, stencil: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.xr.enabled = true;
        renderer.xr.setReferenceSpaceType('local-floor');
        container.appendChild(renderer.domElement);

        // BUTANG MASUK VR/AR (js/core/xr-session.js) — fungsi tulen, sama persis dgn index.html.
        const vrButtonEl = createXRButton(renderer, 'immersive-vr', 'VR');
        vrButtonEl.style.position = 'absolute';
        vrButtonEl.style.bottom = '20px';
        vrButtonEl.style.zIndex = '50';
        container.appendChild(vrButtonEl);

        const arButtonEl = createXRButton(renderer, 'immersive-ar', 'AR');
        arButtonEl.style.position = 'absolute';
        arButtonEl.style.bottom = '70px';
        arButtonEl.style.zIndex = '50';
        container.appendChild(arButtonEl);

        const controls = new THREE.OrbitControls(mainCamera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };

        renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

        // LIGHTING (sama tetapan seperti editor)
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();
        const roomEnv = new THREE.RoomEnvironment();
        scene.environment = pmremGenerator.fromScene(roomEnv).texture;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        function fixModelMaterialLighting(root) {
            root.traverse((child) => {
                if (!child.isMesh || !child.material) return;
                const materials = Array.isArray(child.material) ? child.material : [child.material];
                materials.forEach(mat => {
                    if (mat.map) mat.map.encoding = THREE.sRGBEncoding;
                    if (mat.emissiveMap) mat.emissiveMap.encoding = THREE.sRGBEncoding;
                    if (mat.envMapIntensity !== undefined) mat.envMapIntensity = 0.8;

                    // Material VFX (api/glow/asap): alpha SANGAT rendah + emissive kuat — shader
                    // piawai darab KESELURUHAN piksel dgn alpha rendah tu, jadi glow terang jadi
                    // hampir tak nampak. Tukar jadi additive blending supaya glow terbit penuh.
                    const hasEmissiveGlow = mat.emissiveMap && mat.emissive &&
                        (mat.emissive.r > 0 || mat.emissive.g > 0 || mat.emissive.b > 0);
                    if (mat.transparent && mat.opacity < 0.2 && hasEmissiveGlow) {
                        mat.blending = THREE.AdditiveBlending;
                        mat.depthWrite = false;
                    }

                    if (mat.blending === THREE.AdditiveBlending) {
                        mat.toneMapped = false;
                    }

                    mat.needsUpdate = true;
                });
            });
        }

        // ---------------------------------------------------------------
        // STATE
        // ---------------------------------------------------------------
        const loadedModelsList = [];
        const uploadedAudios = {};
        let hoveredModel = null;
        let activeAudioElement = null;
        let fullScenesData = [];
        let activeSceneId = null;
        let sceneCameraData = { position: [0, 2, 6], rotation: [0, 0, 0] };

        // KANDUNGAN SCENE (semua objek) diletak dalam group ni, BUKAN terus dalam `scene`.
        // Untuk desktop/VR, group ni kekal identity transform. Untuk AR tap-to-place, group
        // INI yang digerakkan ke titik hit-test, bukan kamera.
        const contentRoot = new THREE.Group();
        contentRoot.name = 'ContentRoot';
        scene.add(contentRoot);

        // Utiliti kamera/orbit-pivot (js/core/scene.js) — findCameraOrbitTarget sahaja dipakai
        // di sini (recenterOrbitPivot editor-only, tiada "Show Colliders"/structural-change
        // hook dalam viewer yang perlukannya).
        const { findCameraOrbitTarget } = createSceneUtils({
            THREE,
            getContentRoot: () => contentRoot,
            getRenderer: () => renderer,
            getLoadedModelsList: () => loadedModelsList,
            getControls: () => controls
        });

        // ---- FIZIK (graviti, pelanggaran, bounce) + "INVISIBLE OCCLUDER" CUTOUT ----
        // Logik penuh (sejarah fix #1-#5 occluder, byk ujian box-math) kini di
        // js/physics/world.js, js/physics/occluder.js, js/physics/colliders.js — fail yang
        // SAMA dipakai index.html, bukan kopi berasingan. Zero SETIAP sub-langkah fizik
        // selagi ada objek digenggam — lihat nota penuh dlm index.html.
        physicsWorld.addEventListener('postStep', function () {
            if (appState.grabbedObject) {
                const grabbedBody = appState.grabbedObject.userData._physicsBody;
                if (grabbedBody) grabbedBody.angularVelocity.set(0, 0, 0);
            }
        });

        const { applyCutoutEffect, updateCutoutCameraGating, restoreOriginalMaterial } = createOccluder({
            THREE,
            getLoadedModelsList: () => loadedModelsList,
            getWaypointPathMeshes: () => waypointPathMeshes,
            getMainCamera: () => mainCamera
        });

        // view.html = "sentiasa Pratonton" (tiada mod Editing), jadi: enableDebugVisuals:false
        // (tiada checkbox "Show Colliders", elak overhead cipta wireframe mesh per objek
        // fizik); clearCutoutEffect versi RINGKAS (pulih material asal terus) — BUKAN versi
        // editor (createOccluder().clearCutoutEffect) yang tukar cutter ke wireframe magenta
        // "edit mode", sebab viewer tiada mod Editing utk kembali ke situ pun.
        const {
            buildPhysicsWorldFromScene, syncPhysicsBodiesWithVisibility, teardownPhysicsWorld
        } = createColliders({
            THREE,
            contentRoot,
            getLoadedModelsList: () => loadedModelsList,
            getShowCollidersChecked: () => false,
            getIsPreviewMode: () => true,
            applyCutoutEffect,
            clearCutoutEffect: () => { loadedModelsList.forEach(m => restoreOriginalMaterial(m)); },
            enableDebugVisuals: false
        });

        // RETICLE (penunjuk tap-to-place semasa AR)
        const reticleGeometry = new THREE.RingGeometry(0.08, 0.1, 32).rotateX(-Math.PI / 2);
        const reticleMaterial = new THREE.MeshBasicMaterial({ color: 0x00e5ff });
        const reticle = new THREE.Mesh(reticleGeometry, reticleMaterial);
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);

        let isARSession = false;
        let isPlaced = false;
        let hitTestSource = null;
        let hitTestSourceRequested = false;
        let arAutoPlace = false;

        const clock = new THREE.Clock();
        const infoPopup = document.getElementById('info-popup');
        const arDebugHud = document.getElementById('ar-debug-hud'); // HUD diagnostik sementara — lihat index.html
        let infoPopupHideTimer = null;
        function clearPopupHideTimer() { clearTimeout(infoPopupHideTimer); }

        const gltfLoader = new THREE.GLTFLoader();
        const fbxLoader = new THREE.FBXLoader();

        function showPopupMessage(message, duration) {
            infoPopup.innerText = message;
            infoPopup.style.left = '50%';
            infoPopup.style.top = 'auto';
            infoPopup.style.bottom = '30px';
            infoPopup.style.transform = 'translateX(-50%)';
            infoPopup.style.display = 'block';

            clearTimeout(infoPopupHideTimer);
            infoPopupHideTimer = setTimeout(() => { infoPopup.style.display = 'none'; }, duration);
        }

        function showInfoPopupAtPointer(title, content, duration, clientX, clientY) {
            infoPopup.innerHTML = '';
            if (title) {
                const elTitle = document.createElement('div');
                elTitle.className = 'info-popup-title';
                elTitle.textContent = title;
                infoPopup.appendChild(elTitle);
            }
            const elContent = document.createElement('div');
            elContent.className = 'info-popup-content';
            elContent.textContent = content || '';
            infoPopup.appendChild(elContent);

            infoPopup.style.bottom = 'auto';
            infoPopup.style.transform = 'none';
            infoPopup.style.display = 'block';

            const containerRect = container.getBoundingClientRect();
            let left = clientX - containerRect.left + 16;
            let top = clientY - containerRect.top + 16;

            const maxLeft = container.clientWidth - infoPopup.offsetWidth - 10;
            const maxTop = container.clientHeight - infoPopup.offsetHeight - 10;
            left = Math.max(10, Math.min(left, Math.max(10, maxLeft)));
            top = Math.max(10, Math.min(top, Math.max(10, maxTop)));

            infoPopup.style.left = left + 'px';
            infoPopup.style.top = top + 'px';

            clearTimeout(infoPopupHideTimer);
            infoPopupHideTimer = setTimeout(() => { infoPopup.style.display = 'none'; }, duration);
        }

        // ---------------------------------------------------------------
        // BINA OBJEK DARI DATA TERSIMPAN
        // ---------------------------------------------------------------
        function setupAnimationMixerFor(object3D, animations) {
            let mixer = null, animAction = null;
            if (animations && animations.length > 0) {
                mixer = new THREE.AnimationMixer(object3D);
                animAction = mixer.clipAction(animations[0]);

                mixer.addEventListener('finished', function (e) {
                    if (e.action === animAction) {
                        if (object3D.userData.interactions) {
                            const animAct = object3D.userData.interactions.find(a => a.action === 'toggleModelAnim');
                            if (animAct && animAct.animMode === 'toggleReverse') {
                                if (object3D.userData.animState === 'playing_fwd') {
                                    object3D.userData.animState = 'atEnd';
                                } else if (object3D.userData.animState === 'playing_rev') {
                                    object3D.userData.animState = 'atStart';
                                }
                            } else {
                                object3D.userData.animState = 'stopped';
                            }
                        }
                    }
                });
            }
            return { mixer, animAction };
        }

        function createModelFromData(objData) {
            return new Promise((resolve) => {
                const url = objData.fileUrl;
                if (!url) { resolve(null); return; }

                const ext = objData.fileExt || 'glb';

                const onLoaded = (loadedRoot, animations) => {
                    const mixerInfo = setupAnimationMixerFor(loadedRoot, animations);

                    loadedRoot.userData = {
                        id: objData.id,
                        fileName: objData.fileName,
                        kind: 'model',
                        interactions: objData.interactions || [],
                        initialVisibility: objData.initialVisibility,
                        colliderActiveWhenHidden: objData.colliderActiveWhenHidden || false,
                        isCutter: objData.isCutter || false,
                        excludeFromCutout: objData.excludeFromCutout || false,
                        // "Kedudukan asal" untuk Return-to-Original-on-Release MESTI guna
                        // objData.position (kedudukan TERKINI/terakhir disimpan dari Editor),
                        // BUKAN objData.initialPosition (itu posisi masa objek PERTAMA kali
                        // dicipta/upload dalam Editor — tak pernah dikemaskini lepas tu, jadi
                        // lapuk/jauh berbeza kalau objek dah digerakkan sebelum disimpan).
                        initialPosition: new THREE.Vector3().fromArray(objData.position),
                        initialRotation: new THREE.Euler().fromArray(objData.rotation),
                        isGrabbable: objData.isGrabbable || false,
                        isSolid: objData.isSolid || false,
                        returnToOriginalOnRelease: objData.returnToOriginalOnRelease || false,
                        bounciness: (typeof objData.bounciness === 'number') ? objData.bounciness : 0.4,
                        colliderTrim: objData.colliderTrim || null,
                        isRotating: false,
                        mixer: mixerInfo.mixer,
                        animAction: mixerInfo.animAction,
                        animState: 'stopped',
                        stepStateToggle: false
                    };

                    loadedRoot.position.fromArray(objData.position);
                    loadedRoot.rotation.set(objData.rotation[0], objData.rotation[1], objData.rotation[2]);
                    loadedRoot.scale.fromArray(objData.scale);

                    fixModelMaterialLighting(loadedRoot);

                    contentRoot.add(loadedRoot);
                    loadedModelsList.push(loadedRoot);
                    resolve(loadedRoot);
                };

                const onErr = (err) => { console.error('Ralat memuat model:', err); resolve(null); };

                if (ext === 'fbx') {
                    fbxLoader.load(url, (fbx) => onLoaded(fbx, fbx.animations), undefined, onErr);
                } else {
                    gltfLoader.load(url, (gltf) => onLoaded(gltf.scene, gltf.animations), undefined, onErr);
                }
            });
        }

        function createImageFromData(objData) {
            return new Promise((resolve) => {
                if (!objData.fileUrl) { resolve(null); return; }
                const loader = new THREE.TextureLoader();

                loader.load(objData.fileUrl, (texture) => {
                    texture.encoding = THREE.sRGBEncoding;
                    const imgW = texture.image ? texture.image.width : 0;
                    const imgH = texture.image ? texture.image.height : 0;
                    const aspect = (imgW && imgH) ? (imgW / imgH) : 1;
                    const height = 2;
                    const width = height * aspect;

                    const geometry = new THREE.PlaneGeometry(width, height);
                    const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
                    const mesh = new THREE.Mesh(geometry, material);

                    mesh.userData = {
                        id: objData.id,
                        fileName: objData.fileName,
                        kind: 'image',
                        interactions: objData.interactions || [],
                        initialVisibility: objData.initialVisibility,
                        colliderActiveWhenHidden: objData.colliderActiveWhenHidden || false,
                        isCutter: objData.isCutter || false,
                        excludeFromCutout: objData.excludeFromCutout || false,
                        initialPosition: new THREE.Vector3().fromArray(objData.position),
                        initialRotation: new THREE.Euler().fromArray(objData.rotation),
                        isGrabbable: objData.isGrabbable || false,
                        isSolid: objData.isSolid || false,
                        returnToOriginalOnRelease: objData.returnToOriginalOnRelease || false,
                        bounciness: (typeof objData.bounciness === 'number') ? objData.bounciness : 0.4,
                        colliderTrim: objData.colliderTrim || null,
                        isRotating: false,
                        mixer: null,
                        animAction: null,
                        animState: 'stopped',
                        stepStateToggle: false
                    };

                    mesh.position.fromArray(objData.position);
                    mesh.rotation.set(objData.rotation[0], objData.rotation[1], objData.rotation[2]);
                    mesh.scale.fromArray(objData.scale);

                    contentRoot.add(mesh);
                    loadedModelsList.push(mesh);
                    resolve(mesh);
                }, undefined, (err) => { console.error('Ralat memuat gambar:', err); resolve(null); });
            });
        }

        // ---- WAYPOINT / LALUAN PANDU ARAH (garis anak panah biru mengalir antara waypoint) ----
        // Logik penuh (js/interactions/waypoint.js) kini dikongsi dgn index.html — fail yang
        // SAMA, bukan kopi berasingan. waypointArrowTexture/waypointPathMeshes KEKAL `let` di
        // sini (bukan dipindah ke modul) — occluder.js & animate() di bawah turut baca/tulis
        // dua-dua ni, lihat nota dalam waypoint.js.
        let waypointArrowTexture = null;
        let waypointPathMeshes = [];
        const WAYPOINT_PATH_SCROLL_SPEED = 0.6;
        const { getWaypointArrowTexture, clearWaypointPath, rebuildWaypointPath } = createWaypoint({
            THREE, contentRoot,
            getLoadedModelsList: () => loadedModelsList,
            getCachedArrowTexture: () => waypointArrowTexture,
            setCachedArrowTexture: (v) => { waypointArrowTexture = v; },
            getWaypointPathMeshesList: () => waypointPathMeshes,
            setWaypointPathMeshesList: (v) => { waypointPathMeshes = v; }
        });

        function createPrimitiveFromData(objData) {
            return new Promise((resolve) => {
            let geometry, material;
            const type = objData.primType;

            material = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.4, metalness: 0.2, side: THREE.DoubleSide });

            if (type === 'box') {
                geometry = new THREE.BoxGeometry(1, 1, 1);
            } else if (type === 'sphere') {
                geometry = new THREE.SphereGeometry(0.6, 32, 32);
            } else if (type === 'cylinder') {
                geometry = new THREE.CylinderGeometry(0.5, 0.5, 1.2, 32);
            } else if (type === 'plane') {
                geometry = new THREE.PlaneGeometry(2, 2);
            } else if (type === 'zone') {
                geometry = new THREE.BoxGeometry(0.4, 0.4, 0.4);
                material = new THREE.MeshBasicMaterial({ color: 0x00e5ff, wireframe: true, transparent: true, opacity: 0.8 });
            } else if (type === 'waypoint') {
                geometry = new THREE.CircleGeometry(0.15, 24);
                material = new THREE.MeshBasicMaterial({ color: 0x2196f3, transparent: true, opacity: 0.85, side: THREE.DoubleSide });
            } else if (type === 'text') {
                const userText = objData.textContent || '';
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 1024;
                canvas.height = 256;

                ctx.fillStyle = 'rgba(20, 20, 20, 0.8)';
                ctx.roundRect ? ctx.roundRect(0, 0, canvas.width, canvas.height, 30) : ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fill();

                ctx.strokeStyle = '#007acc';
                ctx.lineWidth = 15;
                ctx.strokeRect(0, 0, canvas.width, canvas.height);

                ctx.font = 'bold 80px "Segoe UI", sans-serif';
                ctx.fillStyle = 'white';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(userText, canvas.width / 2, canvas.height / 2);

                const texture = new THREE.CanvasTexture(canvas);
                material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
                geometry = new THREE.PlaneGeometry(4, 1);
            } else {
                geometry = new THREE.BoxGeometry(1, 1, 1);
            }

            const mesh = new THREE.Mesh(geometry, material);
            mesh.userData = {
                id: objData.id,
                fileName: objData.fileName,
                kind: 'primitive',
                primType: type,
                interactions: objData.interactions || [],
                initialVisibility: objData.initialVisibility,
                colliderActiveWhenHidden: objData.colliderActiveWhenHidden || false,
                isCutter: objData.isCutter || false,
                excludeFromCutout: objData.excludeFromCutout || false,
                initialPosition: new THREE.Vector3().fromArray(objData.position),
                initialRotation: new THREE.Euler().fromArray(objData.rotation),
                isGrabbable: objData.isGrabbable || false,
                isSolid: objData.isSolid || false,
                returnToOriginalOnRelease: objData.returnToOriginalOnRelease || false,
                bounciness: (typeof objData.bounciness === 'number') ? objData.bounciness : 0.4,
                colliderTrim: objData.colliderTrim || null,
                isRotating: false,
                mixer: null,
                animAction: null,
                animState: 'stopped',
                stepStateToggle: false
            };

            if (['box', 'sphere', 'cylinder', 'plane'].includes(type) && objData.customColor) {
                material.color.set(objData.customColor).convertSRGBToLinear();
                mesh.userData.customColor = objData.customColor;
            }

            mesh.position.fromArray(objData.position);
            mesh.rotation.set(objData.rotation[0], objData.rotation[1], objData.rotation[2]);
            mesh.scale.fromArray(objData.scale);

            contentRoot.add(mesh);
            loadedModelsList.push(mesh);

            if (['box', 'sphere', 'cylinder', 'plane'].includes(type) && objData.customTextureUrl) {
                mesh.userData.customTextureUrl = objData.customTextureUrl;
                new THREE.TextureLoader().load(objData.customTextureUrl, (tex) => {
                    material.map = tex;
                    material.needsUpdate = true;
                    resolve(mesh);
                }, undefined, (err) => {
                    console.error('Ralat memuat texture bentuk:', err);
                    resolve(mesh);
                });
            } else {
                resolve(mesh);
            }
            });
        }

        // ---------------------------------------------------------------
        // PENGURUSAN SCENE (baca sahaja)
        // ---------------------------------------------------------------
        function clearViewportObjects() {
            // Henti & lepaskan rujukan AnimationMixer ke root model SEBELUM dibuang — tanpa
            // ni, mixer (disimpan dlm userData.mixer) terus pegang rujukan ke root yg dah
            // dibuang dari scene, punca memory leak bila scene ditukar berulang kali.
            [...loadedModelsList].forEach(m => {
                if (m.userData.mixer) {
                    m.userData.mixer.stopAllAction();
                    m.userData.mixer.uncacheRoot(m);
                }
            });
            [...loadedModelsList].forEach(m => {
                contentRoot.remove(m);
                m.traverse((child) => {
                    if (child.isMesh) {
                        if (child.geometry) child.geometry.dispose();
                        const materials = Array.isArray(child.material) ? child.material : [child.material];
                        materials.forEach(mat => {
                            if (!mat) return;
                            if (mat.map) mat.map.dispose();
                            mat.dispose();
                        });
                    }
                });
            });
            loadedModelsList.length = 0;
            hoveredModel = null;
            clearWaypointPath();
            teardownPhysicsWorld();
        }

        // Cetuskan semua tindakan "onStart" (Sebaik Scene Dimulakan) sekali sahaja setiap
        // kali kandungan scene benar-benar jadi aktif/kelihatan pada pengguna.
        function fireSceneStartTriggers() {
            // Reset status animasi (play/pause/toggleReverse) ke keadaan asal SETIAP
            // kali scene "bermula" (scene dimuat, AR diletak semula, dll) — kalau
            // tidak, status main/jeda terbawa dari sesi sebelumnya, jadi tindakan
            // "Mula/Henti Animasi" yang dipasang pada onStart akan selang-seli
            // (sekali main, sekali jeda) bukan sentiasa main semula dari permulaan.
            loadedModelsList.forEach(m => {
                if (m.userData.mixer && m.userData.animAction) {
                    m.userData.animAction.stop();
                    m.userData.animAction.reset();
                    m.userData.animAction.paused = false;
                    m.userData.animState = 'stopped';
                    m.userData.mixer.update(0);
                }
            });

            loadedModelsList.forEach(m => {
                if (m.userData.interactions && m.userData.interactions.some(act => act.trigger === 'onStart')) {
                    triggerInteraction(m, 'onStart');
                }
            });
        }

        function applyVisibilityAndCamera() {
            loadedModelsList.forEach(m => {
                m.visible = (m.userData.primType === 'zone') ? false : (m.userData.initialVisibility !== false);
            });

            if (renderer.xr.isPresenting) {
                cameraRig.position.set(sceneCameraData.position[0], sceneCameraData.position[1], sceneCameraData.position[2]);
                cameraRig.rotation.set(sceneCameraData.rotation[0], sceneCameraData.rotation[1], sceneCameraData.rotation[2]);
                mainCamera.position.set(0, 0, 0);
                mainCamera.rotation.set(0, 0, 0);
            } else {
                cameraRig.position.set(0, 0, 0);
                cameraRig.rotation.set(0, 0, 0);
                mainCamera.position.set(sceneCameraData.position[0], sceneCameraData.position[1], sceneCameraData.position[2]);
                mainCamera.rotation.set(sceneCameraData.rotation[0], sceneCameraData.rotation[1], sceneCameraData.rotation[2]);

                controls.target.copy(findCameraOrbitTarget(mainCamera.position, mainCamera.quaternion, 3));
                controls.update();
            }

            buildPhysicsWorldFromScene();
            fireSceneStartTriggers();
        }

        // Fallback bila hit-test AR tak disokong peranti/browser — letak kandungan
        // 1.5m di hadapan titik mula sesi AR (tak sepersis tap-to-place, tapi tetap
        // world-locked dan tak "ikut kamera").
        function placeContentAtDefault() {
            contentRoot.position.set(0, 0, -1.5);
            contentRoot.quaternion.identity();
            isPlaced = true;
            reticle.visible = false;
            loadedModelsList.forEach(m => {
                m.visible = (m.userData.primType === 'zone') ? false : (m.userData.initialVisibility !== false);
            });
            buildPhysicsWorldFromScene();
            fireSceneStartTriggers();
        }

        function placeContentAtReticle() {
            contentRoot.position.setFromMatrixPosition(reticle.matrix);
            contentRoot.quaternion.setFromRotationMatrix(reticle.matrix);
            isPlaced = true;
            reticle.visible = false;
            loadedModelsList.forEach(m => {
                m.visible = (m.userData.primType === 'zone') ? false : (m.userData.initialVisibility !== false);
            });
            buildPhysicsWorldFromScene();
            fireSceneStartTriggers();
        }

        async function applySceneDataToViewport(sceneObj) {
            // Tangkap status SEBELUM ia di-reset di bawah — bezakan antara "baru
            // masuk AR, belum letak lagi" (perlu tunggu tap-to-place) dengan "dah
            // letak, scene ni ditukar semasa sesi AR sedang berjalan" (anchor
            // dunia sebenar tak sepatutnya berubah hanya sebab kandungan bertukar).
            const alreadyAnchoredInAR = renderer.xr.isPresenting && isARSession && isPlaced;

            // Semasa sesi AR (passthrough) aktif, scene.background MESTI kekal null
            // supaya kamera dunia sebenar kelihatan — jangan timpa dengan warna latar
            // scene baru (itu akan "tutup" passthrough, tinggal objek je kelihatan).
            // Simpan warna baru tu untuk dipulihkan bila sesi AR tamat nanti.
            if (renderer.xr.isPresenting && isARSession) {
                savedSceneBackgroundForAR = new THREE.Color(sceneObj.bgColor || '#87ceeb');
            } else {
                scene.background = new THREE.Color(sceneObj.bgColor || '#87ceeb');
            }
            sceneCameraData = sceneObj.camera || { position: [0, 2, 6], rotation: [0, 0, 0] };
            arAutoPlace = !!sceneObj.arAutoPlace;

            for (const objData of (sceneObj.objects || [])) {
                if (objData.kind === 'model') {
                    await createModelFromData(objData);
                } else if (objData.kind === 'image') {
                    await createImageFromData(objData);
                } else {
                    await createPrimitiveFromData(objData);
                }
            }

            rebuildWaypointPath();

            if (isARSession) {
                if (alreadyAnchoredInAR) {
                    // ANCHOR: guna kedudukan/orientasi penjangkaran YANG SAMA dari
                    // penempatan sebelum ni untuk scene baharu ni — pengguna tak
                    // perlu tap-to-place berulang kali setiap kali tukar scene.
                    loadedModelsList.forEach(m => {
                        m.visible = (m.userData.primType === 'zone') ? false : (m.userData.initialVisibility !== false);
                    });
                    buildPhysicsWorldFromScene();
                    fireSceneStartTriggers();
                } else {
                    // Penempatan PERTAMA kali: minta pengguna tap-to-place.
                    isPlaced = false;
                    hitTestSourceRequested = false;
                    hitTestSource = null;
                    reticle.visible = false;
                    contentRoot.position.set(0, 0, 0);
                    contentRoot.quaternion.identity();
                    loadedModelsList.forEach(m => { m.visible = false; });
                }
            } else {
                applyVisibilityAndCamera();
            }
        }

        async function switchToScene(sceneId) {
            if (sceneId === activeSceneId) return;
            const sceneObj = fullScenesData.find(s => s.id === sceneId);
            if (!sceneObj) return;

            clearViewportObjects();
            activeSceneId = sceneId;
            await applySceneDataToViewport(sceneObj);
        }

        async function changeSceneDuringInteraction(targetSceneId) {
            if (!targetSceneId || targetSceneId === activeSceneId) return;
            await switchToScene(targetSceneId);
        }

        // ---------------------------------------------------------------
        // SISTEM INTERAKSI (sama logik seperti editor mod pratonton — teks UI kekal
        // Malay di viewer ni, sengaja tak dikongsi dgn js/interactions/triggers.js
        // sebab modul tu guna teks Inggeris + bergantung pada konsep editor-only
        // seperti senarai "Registered Actions" & snapshot pra-Pratonton yang tiada
        // makna dalam viewer baca-sahaja ni)
        // ---------------------------------------------------------------
        function getTargetObjects(sourceModel, targetIdsArray) {
            if (!targetIdsArray || !Array.isArray(targetIdsArray) || targetIdsArray.length === 0) {
                return [sourceModel];
            }
            const targets = [];
            targetIdsArray.forEach(id => {
                if (id === 'self') {
                    if (!targets.includes(sourceModel)) targets.push(sourceModel);
                } else {
                    const found = loadedModelsList.find(o => o.userData.id == id);
                    if (found && !targets.includes(found)) targets.push(found);
                }
            });
            return targets.length > 0 ? targets : [sourceModel];
        }

        function triggerInteraction(model, eventType, clientX, clientY) {
            if (!model.userData.interactions || !Array.isArray(model.userData.interactions)) return;

            const matchingActions = model.userData.interactions.filter(act => act.trigger === eventType);
            if (matchingActions.length === 0) return;

            matchingActions.forEach(config => {
                const targets = getTargetObjects(model, config.targetObjectIds);

                if (config.action === 'toggleModelAnim') {
                    targets.forEach(targetObj => {
                        if (targetObj.userData.mixer && targetObj.userData.animAction) {
                            const action = targetObj.userData.animAction;
                            const state = targetObj.userData.animState;
                            const clipDuration = action.getClip().duration;

                            const startTime = Math.max(0, config.animStartTime || 0);
                            const endTime = (config.animEndTime && config.animEndTime > startTime)
                                ? Math.min(config.animEndTime, clipDuration)
                                : clipDuration;

                            targetObj.userData.customStartTime = startTime;
                            targetObj.userData.customEndTime = endTime;
                            targetObj.userData.animDir = config.animDir;

                            if (config.animMode === 'toggleReverse') {
                                action.setLoop(THREE.LoopOnce, 1);
                                action.clampWhenFinished = true;

                                if (state === 'stopped' || state === 'atStart') {
                                    action.reset();
                                    action.time = startTime;
                                    action.timeScale = 1;
                                    action.play();
                                    action.paused = false;
                                    targetObj.userData.animState = 'playing_fwd';
                                } else if (state === 'atEnd' || state === 'playing_fwd') {
                                    action.paused = false;
                                    action.timeScale = -1;
                                    if (action.time >= endTime) action.time = endTime;
                                    action.play();
                                    targetObj.userData.animState = 'playing_rev';
                                } else if (state === 'playing_rev') {
                                    action.paused = false;
                                    action.timeScale = 1;
                                    action.play();
                                    targetObj.userData.animState = 'playing_fwd';
                                }
                            } else {
                                if (config.animMode === 'once') {
                                    action.setLoop(THREE.LoopOnce, 1);
                                    action.clampWhenFinished = true;
                                } else {
                                    action.setLoop(THREE.LoopRepeat, Infinity);
                                }

                                if (state === 'stopped' || state === 'paused') {
                                    if (state === 'stopped') action.reset();
                                    if (action.time < startTime || action.time >= endTime) action.time = startTime;
                                    action.timeScale = (config.animDir === 'reverse') ? -1 : 1;
                                    action.play();
                                    action.paused = false;
                                    targetObj.userData.animState = 'playing';
                                } else {
                                    action.paused = true;
                                    targetObj.userData.animState = 'paused';
                                }
                            }
                        }
                    });
                }
                else if (config.action === 'stepMove') {
                    targets.forEach(targetObj => {
                        const stepVec = new THREE.Vector3(config.stepX || 0, config.stepY || 0, config.stepZ || 0);
                        stepVec.applyQuaternion(targetObj.quaternion);

                        if (config.stepMode === 'toggle') {
                            if (!targetObj.userData.stepStateToggle) {
                                targetObj.position.add(stepVec);
                                targetObj.userData.stepStateToggle = true;
                            } else {
                                targetObj.position.sub(stepVec);
                                targetObj.userData.stepStateToggle = false;
                            }
                        } else {
                            targetObj.position.add(stepVec);
                        }
                    });
                }
                else if (config.action === 'toggleTargetVisibility') {
                    targets.forEach(targetObj => {
                        targetObj.visible = !targetObj.visible;
                    });
                }
                else if (config.action === 'changeColor') {
                    targets.forEach(targetObj => {
                        targetObj.traverse((child) => {
                            if (child.isMesh && child.material && child.material.color) {
                                child.material.color.setHex(Math.random() * 0xffffff);
                            }
                        });
                    });
                }
                else if (config.action === 'rotateAnim') {
                    targets.forEach(targetObj => {
                        targetObj.userData.isRotating = !targetObj.userData.isRotating;
                    });
                }
                else if (config.action === 'popInfo') {
                    const containerRect = container.getBoundingClientRect();
                    const px = (typeof clientX === 'number') ? clientX : (containerRect.left + container.clientWidth / 2);
                    const py = (typeof clientY === 'number') ? clientY : (containerRect.top + container.clientHeight / 2);
                    const popupDuration = (eventType === 'onHover') ? 3600000 : 3000;
                    showInfoPopupAtPointer(config.noteTitle, config.note || "Maklumat Objek", popupDuration, px, py);
                }
                else if (config.action === 'playSound') {
                    if (config.audioFile && uploadedAudios[config.audioFile]) {
                        const audio = new Audio(uploadedAudios[config.audioFile]);
                        audio.play();
                    }
                }
                else if (config.action === 'changeScene') {
                    changeSceneDuringInteraction(config.targetSceneId);
                }
            });

            const hasPopInfo = matchingActions.some(a => a.action === 'popInfo');
            if (!hasPopInfo) {
                showPopupMessage(`⚡ ${matchingActions.length} Tindakan Dijalankan!`, 1500);
            }
        }

        // ZON SASARAN — semak sama ada objek yang baru dilepas jatuh dalam mana-mana
        // zon yang memantaunya (zon & objek sama-sama anak terus contentRoot, jadi
        // position/quaternion boleh dibanding terus, tak perlu tukar ruang koordinat).
        function checkPlacementZones(droppedObject) {
            let docked = false;

            loadedModelsList.forEach(zoneObj => {
                if (zoneObj.userData.primType !== 'zone' || !zoneObj.userData.interactions) return;

                const matches = zoneObj.userData.interactions.filter(act =>
                    act.trigger === 'onPlaceInZone' &&
                    Array.isArray(act.watchObjectIds) &&
                    act.watchObjectIds.some(wid => wid == droppedObject.userData.id)
                );
                if (matches.length === 0) return;

                const zoneBox = new THREE.Box3().setFromObject(zoneObj);
                const objBox = new THREE.Box3().setFromObject(droppedObject);
                const isColliding = zoneBox.intersectsBox(objBox);
                const isFullyInside = isColliding && zoneBox.containsBox(objBox);

                const satisfied = matches.some(act =>
                    act.zoneTriggerMode === 'fullyInside' ? isFullyInside : isColliding
                );
                if (!satisfied) return;

                droppedObject.position.copy(zoneObj.position);
                droppedObject.quaternion.copy(zoneObj.quaternion);

                const dockedBody = droppedObject.userData._physicsBody;
                if (dockedBody) {
                    dockedBody.position.set(zoneObj.position.x, zoneObj.position.y, zoneObj.position.z);
                    dockedBody.quaternion.set(zoneObj.quaternion.x, zoneObj.quaternion.y, zoneObj.quaternion.z, zoneObj.quaternion.w);
                    dockedBody.velocity.set(0, 0, 0);
                    dockedBody.angularVelocity.set(0, 0, 0);
                    dockedBody.type = CANNON.Body.STATIC;
                    dockedBody.mass = 0;
                    dockedBody.updateMassProperties();
                }

                triggerInteraction(zoneObj, 'onPlaceInZone');
                docked = true;
            });

            return docked;
        }

        // KEMBALIKAN OBJEK KE KEDUDUKAN/PUTARAN ASAL (bila "returnToOriginalOnRelease").
        function returnObjectToOriginalTransform(obj) {
            obj.position.copy(obj.userData.initialPosition);
            obj.quaternion.setFromEuler(obj.userData.initialRotation);

            const body = obj.userData._physicsBody;
            if (body) {
                body.position.set(obj.position.x, obj.position.y, obj.position.z);
                body.quaternion.set(obj.quaternion.x, obj.quaternion.y, obj.quaternion.z, obj.quaternion.w);
                body.velocity.set(0, 0, 0);
                body.angularVelocity.set(0, 0, 0);
            }
        }

        // ZON KEHADIRAN PENGGUNA — semak setiap bingkai sama ada kamera (pengguna sendiri)
        // baru masuk ke dalam mana-mana Zon Sasaran yang ada trigger "onUserEnterZone"
        // (wayfinding: pengguna sampai satu blok/titik -> tukar scene). Dicetus SEKALI
        // sahaja pada peralihan luar->dalam (edge-triggered).
        function checkUserZoneEntryTriggers() {
            const camPos = new THREE.Vector3();
            mainCamera.getWorldPosition(camPos);

            loadedModelsList.forEach(zoneObj => {
                if (zoneObj.userData.primType !== 'zone' || !zoneObj.userData.interactions) return;
                const hasEnterTrigger = zoneObj.userData.interactions.some(act => act.trigger === 'onUserEnterZone');
                if (!hasEnterTrigger) return;

                const zoneBox = new THREE.Box3().setFromObject(zoneObj);
                const isInside = zoneBox.containsPoint(camPos);
                const wasInside = !!zoneObj.userData._userInsideZone;
                zoneObj.userData._userInsideZone = isInside;

                if (isInside && !wasInside) {
                    triggerInteraction(zoneObj, 'onUserEnterZone');
                }
            });
        }

        // ---------------------------------------------------------------
        // INPUT: CONTROLLER VR/AR (laser pointer) — js/ui/controller-visuals.js, fail yang
        // SAMA dipakai index.html.
        // ---------------------------------------------------------------
        const controller1 = renderer.xr.getController(0);
        const controller2 = renderer.xr.getController(1);
        // Controller MESTI jadi anak cameraRig (sama macam mainCamera), bukan scene
        // terus — kalau tidak, bila cameraRig "teleport" (ikut Kedudukan Awal Kamera
        // scene semasa), pandangan berpindah tapi controller kekal di kedudukan asal
        // (dekat origin dunia) — tangan/laser jadi terputus & salah trajektori
        // berbanding apa yang pengguna nampak/rasa.
        cameraRig.add(controller1);
        cameraRig.add(controller2);

        const { setupControllerLaserVisuals, flashControllerTrigger, getControllerRaycastHit, getControllerGrabRaycastHit } =
            createControllerVisuals({ THREE, mainCamera, scene, contentRoot, getLoadedModelsList: () => loadedModelsList });
        setupControllerLaserVisuals(controller1);
        setupControllerLaserVisuals(controller2);
        controller1.addEventListener('selectstart', flashControllerTrigger);
        controller2.addEventListener('selectstart', flashControllerTrigger);

        // HUD diagnostik AR (js/ui/ar-debug-hud.js) — fail yang SAMA dipakai index.html.
        const { updateARDebugHud } = createArDebugHud({ THREE, mainCamera, arDebugHud });

        // ---- PICK & PLACE (genggam & alih objek "Boleh Diambil") ----
        // Logik penuh (constants, computeMoveGain, updateGrabbedObjectTransform,
        // computeARGrabDistance, updateARGrabProxy, dan seluruh sistem klik/hover/genggam
        // tetikus+controller) kini di js/interactions/grab-core.js, grab-ar.js,
        // pointer-grab.js — fail yang SAMA dipakai index.html (bukan kopi berasingan yang
        // boleh drift drpd sejarah bug grab yang panjang/fragile ni).
        const { updateGrabbedObjectTransform } = createGrabCore({ THREE });
        const { computeARGrabDistance, updateARGrabProxy } = createArGrab({ THREE });

        let vrPendingGrabCandidate = null;
        let isMouseGrabbing = false;

        const {
            setupPointerInteraction,
            checkARTouchAwaitingGrab, checkVRPendingGrabCommit, onControllerSelectEnd, onControllerSelect
        } = createPointerGrab({
            THREE,
            getRenderer: () => renderer,
            getMainCamera: () => mainCamera,
            getControls: () => controls,
            getScene: () => scene,
            getContentRoot: () => contentRoot,
            getCameraRig: () => cameraRig,
            // previewCameraMarker/gizmo/selectObject-deselectObject — konsep editor-only,
            // viewer baca-sahaja (isPreviewMode sentiasa true) jadi laluan yg guna ia
            // (cawangan "bukan Pratonton" dalam pointer-grab.js) tak pernah tercapai.
            getPreviewCameraMarker: () => null,
            getReticle: () => reticle,
            getLoadedModelsList: () => loadedModelsList,
            getHoveredModel: () => hoveredModel,
            setHoveredModel: (v) => { hoveredModel = v; },
            getIsPreviewMode: () => true,
            getIsARSession: () => isARSession,
            getIsPlaced: () => isPlaced,
            getIsDraggingGizmo: () => false,
            getIsMouseGrabbing: () => isMouseGrabbing,
            setIsMouseGrabbing: (v) => { isMouseGrabbing = v; },
            getVrPendingGrabCandidate: () => vrPendingGrabCandidate,
            setVrPendingGrabCandidate: (v) => { vrPendingGrabCandidate = v; },
            getInfoPopup: () => infoPopup,
            clearPopupHideTimer,
            triggerInteraction,
            selectObject: () => {}, deselectObject: () => {},
            checkPlacementZones, returnObjectToOriginalTransform,
            placeContentAtReticle,
            getControllerRaycastHit, getControllerGrabRaycastHit,
            computeARGrabDistance, computeMoveGain, buildGrabStartState,
            AR_SCREEN_GRAB_ANGLE_THRESHOLD, AR_SCREEN_GRAB_MIN_HOLD_MS, VR_GRAB_ANGLE_THRESHOLD, VR_GRAB_POS_THRESHOLD,
            // viewer baca-sahaja — tiada auto-save.
            scheduleAutoSave: () => {}
        });
        setupPointerInteraction();

        controller1.addEventListener('select', onControllerSelect);
        controller2.addEventListener('select', onControllerSelect);
        controller1.addEventListener('selectstart', (e) => pointerGrabSelectStart(e));
        controller1.addEventListener('selectend', onControllerSelectEnd);
        controller2.addEventListener('selectstart', (e) => pointerGrabSelectStart(e));
        controller2.addEventListener('selectend', onControllerSelectEnd);
        // onControllerSelectStart sengaja tak di-destructure terus di atas (ESLint-style
        // bypass tak diperlukan di sini) — lihat wiring sebenar di bawah pointerGrabSelectStart.

        // ---------------------------------------------------------------
        // SESI WEBXR (VR/AR) — reposisi kamera & urus latar passthrough
        // ---------------------------------------------------------------
        let savedSceneBackgroundForAR = null;

        renderer.xr.addEventListener('sessionstart', () => {
            const session = renderer.xr.getSession();
            const blendMode = session && session.environmentBlendMode;
            isARSession = !!(blendMode && blendMode !== 'opaque');

            if (isARSession) {
                // MOD AR: jangan papar kandungan dulu — tunggu pengguna tap-to-place.
                // Kamera TIDAK digerakkan (kekal ikut tracking peranti sebenar); yang
                // digerakkan ialah contentRoot, ke titik hit-test yang ditap.
                isPlaced = false;
                hitTestSourceRequested = false;
                hitTestSource = null;
                reticle.visible = false;
                contentRoot.position.set(0, 0, 0);
                contentRoot.quaternion.identity();
                loadedModelsList.forEach(m => { m.visible = false; });

                savedSceneBackgroundForAR = scene.background;
                scene.background = null;
            } else {
                // MOD VR: kekal gelagat asal — kamera diletak di Kedudukan Awal Kamera scene.
                applyVisibilityAndCamera();
            }
        });
        renderer.xr.addEventListener('sessionend', () => {
            cameraRig.position.set(0, 0, 0);
            cameraRig.rotation.set(0, 0, 0);
            contentRoot.position.set(0, 0, 0);
            contentRoot.quaternion.identity();

            isARSession = false;
            isPlaced = false;
            hitTestSource = null;
            hitTestSourceRequested = false;
            reticle.visible = false;

            if (savedSceneBackgroundForAR !== null) {
                scene.background = savedSceneBackgroundForAR;
                savedSceneBackgroundForAR = null;
            }

            applyVisibilityAndCamera();
        });

        // ---------------------------------------------------------------
        // ANIMATE LOOP
        // ---------------------------------------------------------------
        function animate(timestamp, frame) {
            const delta = clock.getDelta();

            if (!renderer.xr.isPresenting) {
                controls.update();
            }

            // ALIRAN ANAK PANAH LALUAN WAYPOINT
            if (waypointPathMeshes.length > 0) {
                getWaypointArrowTexture().offset.x -= delta * WAYPOINT_PATH_SCROLL_SPEED;
            }

            // "Pengguna masuk zon" cuma bermakna bila kamera = kedudukan sebenar
            // pengguna di dunia nyata (sesi AR/VR sebenar sedang presenting). Dalam
            // mod 3D biasa (orbit ikut tetikus), kamera tak mewakili kedudukan
            // sebenar pengguna — check di sini akan tercetus tanpa diingini bila
            // kamera orbit "lalu" dekat zon semasa drag rotate.
            if (renderer.xr.isPresenting) {
                checkUserZoneEntryTriggers();
            }

            // TAP-TO-PLACE (hit-test) — hanya semasa AR aktif & belum diletak lagi.
            // Scene boleh tanda "Auto Letak AR" (arAutoPlace) untuk skip terus tanpa tunggu tap.
            if (renderer.xr.isPresenting && isARSession && !isPlaced && arAutoPlace) {
                placeContentAtDefault();
            } else if (renderer.xr.isPresenting && isARSession && !isPlaced && frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (!hitTestSourceRequested) {
                    hitTestSourceRequested = true;

                    if (session.requestHitTestSource) {
                        session.requestReferenceSpace('viewer').then((viewerSpace) => {
                            session.requestHitTestSource({ space: viewerSpace }).then((source) => {
                                hitTestSource = source;
                            }).catch(() => placeContentAtDefault());
                        }).catch(() => placeContentAtDefault());

                        session.addEventListener('end', () => {
                            hitTestSourceRequested = false;
                            hitTestSource = null;
                        });
                    } else {
                        // Peranti/browser tak sokong hit-test langsung
                        placeContentAtDefault();
                    }
                }

                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    if (hitTestResults.length > 0) {
                        const pose = hitTestResults[0].getPose(referenceSpace);
                        if (pose) {
                            reticle.visible = true;
                            reticle.matrix.fromArray(pose.transform.matrix);
                        }
                    } else {
                        reticle.visible = false;
                    }
                }
            } else if (!isPlaced) {
                reticle.visible = false;
            }

            checkARTouchAwaitingGrab(controller1, controller2);
            checkVRPendingGrabCommit();

            // HUD DIAGNOSTIK SEMENTARA — lihat nota penuh dekat deklarasi `arDebug`/
            // `updateARDebugHud` di js/ui/ar-debug-hud.js. BUANG lepas bug AR grab ni
            // disahkan selesai. isPreviewMode sentiasa true di viewer.
            updateARDebugHud({
                isPreviewMode: true, isARSession, isPresenting: renderer.xr.isPresenting,
                vrPendingGrabCandidate, grabbedObject: appState.grabbedObject, grabStartState: appState.grabStartState
            });

            if (appState.grabbedObject && appState.grabStartState && appState.grabStartState.arRawController) {
                updateARGrabProxy(appState.grabStartState, { mainCamera, arDebug });
            }

            if (appState.grabbedObject) {
                updateGrabbedObjectTransform(appState.grabbedObject, appState.grabStartState, delta, { physicsWorld, arVelocityBlend: AR_GRAB_VELOCITY_BLEND });
            } else if (renderer.xr.isPresenting) {
                const vrHit1 = getControllerRaycastHit(controller1);
                const vrHit2 = getControllerRaycastHit(controller2);
                const vrHit = vrHit1 || vrHit2;
                if (vrHit !== hoveredModel) {
                    hoveredModel = vrHit;
                    if (hoveredModel) triggerInteraction(hoveredModel, 'onHover');
                }
            }

            // FIZIK (graviti/pelanggaran/bounce) — tunggu content diletak dulu dalam AR.
            if (appState.physicsActive && (!isARSession || isPlaced)) {
                updateCutoutCameraGating();
                syncPhysicsBodiesWithVisibility();
                if (appState.grabbedObject) {
                    // Semasa genggam, guna delta bingkai SEBENAR (satu langkah tepat, tiada
                    // accumulator/skip) supaya objek 1:1 ikut kelajuan kursor/controller —
                    // lihat nota penuh dlm index.html.
                    physicsWorld.step(Math.min(delta || 1 / 60, 1 / 20));
                } else {
                    physicsWorld.step(1 / 60, delta, 10);
                }
                appState.physicsBodies.forEach(pb => {
                    if (!pb.inWorld) return;
                    if (pb.body.type !== CANNON.Body.STATIC) {
                        pb.mesh.position.copy(pb.body.position);
                        pb.mesh.quaternion.copy(pb.body.quaternion);
                    }
                });
            }

            loadedModelsList.forEach(m => {
                if (m.userData.mixer && m.userData.animAction && (m.userData.animState === 'playing' || m.userData.animState === 'playing_fwd' || m.userData.animState === 'playing_rev')) {
                    const action = m.userData.animAction;
                    const startTime = m.userData.customStartTime || 0;
                    const endTime = m.userData.customEndTime || action.getClip().duration;
                    const dir = m.userData.animDir || 'forward';

                    if (action.timeScale > 0 && action.time >= endTime) {
                        if (dir === 'pingpong') {
                            action.timeScale = -1;
                        } else if (m.userData.interactions) {
                            const act = m.userData.interactions.find(a => a.action === 'toggleModelAnim');
                            if (act && act.animMode === 'toggleReverse') {
                                action.paused = true;
                                action.time = endTime;
                                m.userData.animState = 'atEnd';
                            } else if (act && act.animMode === 'once') {
                                action.paused = true;
                                action.time = endTime;
                                m.userData.animState = 'stopped';
                            } else {
                                action.time = startTime;
                            }
                        }
                    }
                    else if (action.timeScale < 0 && action.time <= startTime) {
                        if (dir === 'pingpong') {
                            action.timeScale = 1;
                        } else if (m.userData.interactions) {
                            const act = m.userData.interactions.find(a => a.action === 'toggleModelAnim');
                            if (act && act.animMode === 'toggleReverse') {
                                action.paused = true;
                                action.time = startTime;
                                m.userData.animState = 'atStart';
                            } else if (act && act.animMode === 'once') {
                                action.paused = true;
                                action.time = startTime;
                                m.userData.animState = 'stopped';
                            } else {
                                action.time = endTime;
                            }
                        }
                    }

                    m.userData.mixer.update(delta);
                }

                if (m.userData.isRotating) {
                    m.rotation.y += 0.01;
                }
            });

            renderer.render(scene, mainCamera);
        }
        renderer.setAnimationLoop(animate);

        window.addEventListener('resize', () => {
            if (renderer.xr.isPresenting) return;
            mainCamera.aspect = container.clientWidth / container.clientHeight;
            mainCamera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // ---------------------------------------------------------------
        // MUAT PROJEK DARI SUPABASE (ikut ?project=<id> dalam URL)
        // ---------------------------------------------------------------
        async function loadPublicProject(projectId) {
            const { data, error } = await supabaseClient
                .from('projects')
                .select('id,name,data,is_public')
                .eq('id', projectId)
                .single();

            if (error || !data) {
                showStatus('❌ Project Not Found', 'This project does not exist, or the link is invalid.', true);
                return;
            }

            if (!data.is_public) {
                showStatus('🔒 Private Project', 'The owner of this project has not made it public yet. Ask the owner to enable "Public" status to share this link.', true);
                return;
            }

            const projectData = data.data || {};
            fullScenesData = projectData.scenes || [];

            if (fullScenesData.length === 0) {
                showStatus('📭 Empty Project', 'This project has no content yet.', true);
                return;
            }

            (projectData.audios || []).forEach(a => {
                uploadedAudios[a.fileName] = a.url;
            });

            const badge = document.getElementById('project-badge');
            badge.innerText = '📁 ' + (data.name || 'Project');
            badge.style.display = 'block';

            // Scene PERTAMA dalam senarai sentiasa jadi default (sama macam mod Pratonton editor)
            const firstScene = fullScenesData[0];
            activeSceneId = firstScene.id;
            await applySceneDataToViewport(firstScene);

            hideStatus();
        }

        // FAIL EKSPORT BERDIRI SENDIRI (standalone .html) — editor (index.html) boleh
        // "bake" data projek (dengan semua asset ditukar jadi data URI base64) terus ke
        // dalam fail ni sebagai window.__EMBEDDED_PROJECT__, supaya fail ni boleh jalan
        // 100% offline/dari server sendiri pengguna, tanpa panggil Supabase langsung.
        async function loadEmbeddedProject(projectRow) {
            const projectData = projectRow.data || {};
            fullScenesData = projectData.scenes || [];

            if (fullScenesData.length === 0) {
                showStatus('📭 Empty Project', 'This project has no content yet.', true);
                return;
            }

            (projectData.audios || []).forEach(a => {
                uploadedAudios[a.fileName] = a.url;
            });

            const badge = document.getElementById('project-badge');
            badge.innerText = '📁 ' + (projectRow.name || 'Project');
            badge.style.display = 'block';

            const firstScene = fullScenesData[0];
            activeSceneId = firstScene.id;
            await applySceneDataToViewport(firstScene);

            hideStatus();
        }

        const urlParams = new URLSearchParams(window.location.search);
        const projectIdParam = urlParams.get('project');

        if (window.__EMBEDDED_PROJECT__) {
            loadEmbeddedProject(window.__EMBEDDED_PROJECT__);
        } else if (!projectIdParam) {
            showStatus('⚠️ No Project Specified', 'This link is incomplete — please use the link/QR provided by the project creator.', true);
        } else {
            loadPublicProject(projectIdParam);
        }
    </script>
</body>
</html>
