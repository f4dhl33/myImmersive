<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR PdP Viewer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        html, body { overflow: hidden; background-color: #1a1a1a; color: white; height: 100%; width: 100%; }
        #canvas-container { position: relative; height: 100%; width: 100%; overflow: hidden; }

        #status-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 10, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            text-align: center;
            padding: 20px;
        }
        #status-overlay .box { max-width: 340px; }
        #status-overlay h2 { font-size: 16px; color: #007acc; margin-bottom: 10px; }
        #status-overlay p { font-size: 12px; color: #aaa; line-height: 1.6; }
        #status-overlay.error h2 { color: #d9534f; }

        #project-badge {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.85);
            padding: 6px 16px;
            border-radius: 8px;
            border: 1px solid #444;
            font-size: 12px;
            color: #eee;
            z-index: 20;
            display: none;
        }

        #info-popup {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 10px 18px;
            border-radius: 8px;
            border: 2px solid #007acc;
            font-size: 14px;
            font-weight: bold;
            display: none;
            z-index: 30;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            pointer-events: none;
            max-width: 280px;
        }
        #info-popup .info-popup-title { font-size: 14px; font-weight: bold; color: #ffcc00; margin-bottom: 3px; }
        #info-popup .info-popup-content { font-size: 13px; font-weight: normal; color: #fff; }
    </style>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <!-- THREE.JS -->
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>

    <div id="status-overlay">
        <div class="box">
            <h2 id="status-title">⏳ Loading Project...</h2>
            <p id="status-text">Please wait a moment.</p>
        </div>
    </div>

    <div id="canvas-container">
        <div id="project-badge"></div>
        <div id="info-popup"></div>

        <!-- HUD DIAGNOSTIK SEMENTARA — lihat nota penuh dlm index.html. BUANG lepas bug AR
        grab tap-and-hold ni disahkan selesai. -->
        <div id="ar-debug-hud" style="display:none; position:fixed; bottom:8px; left:8px; z-index:99999; background:rgba(0,0,0,0.75); color:#0f0; font:11px monospace; padding:6px 8px; border-radius:4px; max-width:80vw; white-space:pre-wrap; pointer-events:none;"></div>
    </div>

    <script>
        // ---------------------------------------------------------------
        // SUPABASE (baca sahaja — projek awam)
        // ---------------------------------------------------------------
        const SUPABASE_URL = 'https://jmuraizgowqwmpmetupu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_DZ8vjKrIJhXM34D7ddS6dw_nlIL18YD';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function showStatus(title, text, isError) {
            const overlay = document.getElementById('status-overlay');
            overlay.style.display = 'flex';
            overlay.className = isError ? 'error' : '';
            document.getElementById('status-title').innerText = title;
            document.getElementById('status-text').innerText = text;
        }

        function hideStatus() {
            document.getElementById('status-overlay').style.display = 'none';
        }

        // ---------------------------------------------------------------
        // VRButton/ARButton — sama seperti index.html (r128 tiada versi
        // classic script, ditulis semula terus di sini).
        // ---------------------------------------------------------------
        function createXRButton(renderer, sessionMode, label) {
            const button = document.createElement('button');
            const isAR = sessionMode === 'immersive-ar';

            function stylizeElement(element) {
                element.style.position = 'absolute';
                element.style.bottom = '20px';
                element.style.padding = '12px 6px';
                element.style.border = '1px solid #fff';
                element.style.borderRadius = '4px';
                element.style.background = 'rgba(0,0,0,0.1)';
                element.style.color = '#fff';
                element.style.font = 'normal 13px sans-serif';
                element.style.textAlign = 'center';
                element.style.opacity = '0.5';
                element.style.outline = 'none';
                element.style.zIndex = '999';
            }

            // Peranti/browser tak sokong sesi XR ni (contoh: tiada ARCore, atau
            // VR/AR session type tak disokong) — sorok terus butang (bukan papar
            // "NOT SUPPORTED") supaya pengguna automatik teruskan dengan 3D biasa
            // (OrbitControls) yang dah berfungsi sejak awal, tanpa nampak macam ralat.
            function showXRNotFound() {
                console.info(label + ' session not supported on this device/browser — falling back to regular 3D view.');
                button.style.display = 'none';
            }

            function showEnterXR() {
                let currentSession = null;

                async function onSessionStarted(session) {
                    session.addEventListener('end', onSessionEnded);
                    await renderer.xr.setSession(session);
                    button.textContent = 'EXIT ' + label;
                    currentSession = session;
                }

                function onSessionEnded() {
                    currentSession.removeEventListener('end', onSessionEnded);
                    button.textContent = 'ENTER ' + label;
                    currentSession = null;
                }

                button.style.display = '';
                button.style.cursor = 'pointer';
                button.style.left = 'calc(50% - 50px)';
                button.style.width = '100px';
                button.textContent = 'ENTER ' + label;

                button.onmouseenter = () => { button.style.opacity = '1.0'; };
                button.onmouseleave = () => { button.style.opacity = '0.5'; };
                button.onclick = () => {
                    if (currentSession === null) {
                        // 'dom-overlay' perlukan `domOverlay: {root}` turut dihantar utk
                        // SEBENARNYA aktif — lihat nota penuh dlm index.html.
                        const sessionInit = isAR
                            ? { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking', 'dom-overlay', 'hit-test'], domOverlay: { root: document.body } }
                            : { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] };
                        navigator.xr.requestSession(sessionMode, sessionInit).then(onSessionStarted);
                    } else {
                        currentSession.end();
                    }
                };
            }

            if ('xr' in navigator) {
                button.id = sessionMode + '-button';
                button.style.display = 'none';
                stylizeElement(button);

                navigator.xr.isSessionSupported(sessionMode).then(function (supported) {
                    supported ? showEnterXR() : showXRNotFound();
                }).catch(() => showXRNotFound());

                return button;
            } else {
                // Browser ni langsung tiada WebXR API (contoh: Safari/iOS) — jangan
                // papar sebarang mesej/link yang nampak macam ralat. Just sorokkan
                // sepenuhnya dan biar 3D view (OrbitControls) jadi pengalaman default.
                console.info('WebXR API not available in this browser' + (window.isSecureContext === false ? ' (page is not HTTPS)' : '') + ' — falling back to regular 3D view.');
                const placeholder = document.createElement('div');
                placeholder.style.display = 'none';
                return placeholder;
            }
        }

        // ---------------------------------------------------------------
        // THREE.JS SETUP
        // ---------------------------------------------------------------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const mainCamera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
        mainCamera.position.set(3, 4, 5);

        const cameraRig = new THREE.Object3D();
        cameraRig.name = 'CameraRig';
        cameraRig.add(mainCamera);
        scene.add(cameraRig);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, stencil: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.xr.enabled = true;
        renderer.xr.setReferenceSpaceType('local-floor');
        container.appendChild(renderer.domElement);

        const vrButtonEl = createXRButton(renderer, 'immersive-vr', 'VR');
        vrButtonEl.style.position = 'absolute';
        vrButtonEl.style.bottom = '20px';
        vrButtonEl.style.zIndex = '50';
        container.appendChild(vrButtonEl);

        const arButtonEl = createXRButton(renderer, 'immersive-ar', 'AR');
        arButtonEl.style.position = 'absolute';
        arButtonEl.style.bottom = '70px';
        arButtonEl.style.zIndex = '50';
        container.appendChild(arButtonEl);

        const controls = new THREE.OrbitControls(mainCamera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };

        // Cari titik pivot yang sepadan dengan JARAK SEBENAR kandungan dari kamera —
        // bukan jarak tetap (contoh 3 unit) yang tak kira di mana objek sebenar
        // berada (boleh buat objek jauh "berpusar" dramatik keliling kamera bila
        // jarak tu tak match). Raycast sepanjang arah pandangan kamera; kalau kena
        // objek, guna titik tu sebagai pivot. Kalau tidak, fallback ke jarak tetap.
        function findCameraOrbitTarget(camPosition, camQuaternion, fallbackDistance) {
            contentRoot.updateMatrixWorld(true);
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camQuaternion).normalize();
            const rc = new THREE.Raycaster(camPosition.clone(), forward.clone());
            const hits = rc.intersectObjects(loadedModelsList.filter(o => o.visible), true);
            if (hits.length > 0) {
                return hits[0].point;
            }
            return camPosition.clone().add(forward.multiplyScalar(fallbackDistance));
        }

        renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

        // LIGHTING (sama tetapan seperti editor)
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();
        const roomEnv = new THREE.RoomEnvironment();
        scene.environment = pmremGenerator.fromScene(roomEnv).texture;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        function fixModelMaterialLighting(root) {
            root.traverse((child) => {
                if (!child.isMesh || !child.material) return;
                const materials = Array.isArray(child.material) ? child.material : [child.material];
                materials.forEach(mat => {
                    if (mat.map) mat.map.encoding = THREE.sRGBEncoding;
                    if (mat.emissiveMap) mat.emissiveMap.encoding = THREE.sRGBEncoding;
                    if (mat.envMapIntensity !== undefined) mat.envMapIntensity = 0.8;

                    // Material VFX (api/glow/asap): alpha SANGAT rendah + emissive kuat
                    // (contoh diffuse alpha 0.07, emissiveFactor putih penuh) — shader
                    // piawai darab KESELURUHAN piksel (termasuk glow terang) dengan
                    // alpha rendah tu, jadi glow yang patut terang jadi hampir tak
                    // nampak. Tukar jadi additive blending supaya glow terbit penuh
                    // tanpa terikat alpha asap (macam software/viewer asal render dia).
                    const hasEmissiveGlow = mat.emissiveMap && mat.emissive &&
                        (mat.emissive.r > 0 || mat.emissive.g > 0 || mat.emissive.b > 0);
                    if (mat.transparent && mat.opacity < 0.2 && hasEmissiveGlow) {
                        mat.blending = THREE.AdditiveBlending;
                        mat.depthWrite = false;
                    }

                    // Tone mapping ACES mampatkan bahagian terang — material additive
                    // (glow/particle) patut "terbit" penuh tanpa kena mampatan ni.
                    if (mat.blending === THREE.AdditiveBlending) {
                        mat.toneMapped = false;
                    }

                    mat.needsUpdate = true;
                });
            });
        }

        // ---------------------------------------------------------------
        // STATE
        // ---------------------------------------------------------------
        const loadedModelsList = [];
        const uploadedAudios = {};
        let hoveredModel = null;
        let activeAudioElement = null;
        let fullScenesData = [];
        let activeSceneId = null;
        let sceneCameraData = { position: [0, 2, 6], rotation: [0, 0, 0] };

        // KANDUNGAN SCENE (semua objek) diletak dalam group ni, BUKAN terus dalam `scene`.
        // Untuk desktop/VR, group ni kekal identity transform (sama macam sebelum ni).
        // Untuk AR tap-to-place, group INI yang digerakkan ke titik hit-test, bukan kamera.
        const contentRoot = new THREE.Group();
        contentRoot.name = 'ContentRoot';
        scene.add(contentRoot);

        // ---- FIZIK RINGKAS (graviti, pelanggaran, bounce) — guna cannon.js ----
        // Sama macam editor: simulasi berjalan dalam ruang LOKAL contentRoot supaya tak perlu
        // tukar koordinat dunia bila contentRoot berpindah (tap-to-place AR).
        const physicsWorld = new CANNON.World();
        physicsWorld.gravity.set(0, -9.82, 0);
        physicsWorld.broadphase = new CANNON.NaiveBroadphase();
        physicsWorld.solver.iterations = 10;

        // Zero angularVelocity SETIAP sub-langkah fizik (bukan cuma setiap bingkai render)
        // selagi ada objek digenggam — lihat nota penuh dlm index.html.
        physicsWorld.addEventListener('postStep', function () {
            if (grabbedObject) {
                const grabbedBody = grabbedObject.userData._physicsBody;
                if (grabbedBody) grabbedBody.angularVelocity.set(0, 0, 0);
            }
        });

        const physicsDefaultMaterial = new CANNON.Material('default');
        const physicsContactMaterial = new CANNON.ContactMaterial(physicsDefaultMaterial, physicsDefaultMaterial, {
            friction: 0.4,
            restitution: 0.4
        });
        physicsWorld.addContactMaterial(physicsContactMaterial);
        physicsWorld.defaultContactMaterial = physicsContactMaterial;

        // Bahan fizik berasingan untuk setiap NILAI bounciness tersendiri (bukan setiap
        // objek) — dicache ikut nilai supaya tak daftar ContactMaterial berulang-ulang
        // setiap kali physics rebuild. Objek dengan bounciness lalai (0.4) kongsi
        // physicsDefaultMaterial sedia ada.
        const physicsBounceMaterialCache = new Map();
        function getPhysicsMaterialForBounciness(bounciness) {
            const key = Math.round(bounciness * 100) / 100;
            if (key === 0.4) return physicsDefaultMaterial;
            if (physicsBounceMaterialCache.has(key)) return physicsBounceMaterialCache.get(key);

            const mat = new CANNON.Material('bounce_' + key);
            physicsWorld.addContactMaterial(new CANNON.ContactMaterial(mat, physicsDefaultMaterial, {
                friction: 0.4,
                restitution: key
            }));
            physicsWorld.addContactMaterial(new CANNON.ContactMaterial(mat, mat, {
                friction: 0.4,
                restitution: key
            }));
            physicsBounceMaterialCache.set(key, mat);
            return mat;
        }

        let physicsBodies = [];
        let physicsActive = false;

        function isMaterialEffectivelyInvisible(material) {
            if (!material) return false;
            const mats = Array.isArray(material) ? material : [material];
            return mats.every(m => m && (m.visible === false || (m.transparent && m.opacity <= 0.02)));
        }

        function computeVisibleWorldBox3(root) {
            root.updateMatrixWorld(true);
            const box = new THREE.Box3();
            const tmpBox = new THREE.Box3();
            const tmpVec = new THREE.Vector3();
            let hasAny = false;
            (function recurse(node) {
                if (node.visible === false) return;
                if (node.isMesh && isMaterialEffectivelyInvisible(node.material)) return;
                if (node.isSkinnedMesh && node.geometry && node.skeleton) {
                    node.skeleton.update();
                    const posAttr = node.geometry.attributes.position;
                    let firstVertex = true;
                    const skinnedBox = new THREE.Box3();
                    for (let i = 0; i < posAttr.count; i++) {
                        node.boneTransform(i, tmpVec);
                        tmpVec.applyMatrix4(node.matrixWorld);
                        if (firstVertex) { skinnedBox.min.copy(tmpVec); skinnedBox.max.copy(tmpVec); firstVertex = false; }
                        else skinnedBox.expandByPoint(tmpVec);
                    }
                    if (!firstVertex) {
                        if (!hasAny) { box.copy(skinnedBox); hasAny = true; }
                        else box.union(skinnedBox);
                    }
                } else if (node.isMesh && node.geometry) {
                    if (!node.geometry.boundingBox) node.geometry.computeBoundingBox();
                    tmpBox.copy(node.geometry.boundingBox).applyMatrix4(node.matrixWorld);
                    if (!hasAny) { box.copy(tmpBox); hasAny = true; }
                    else box.union(tmpBox);
                }
                for (let i = 0; i < node.children.length; i++) recurse(node.children[i]);
            })(root);
            if (!hasAny) box.setFromObject(root);
            return box;
        }

        function computeLocalBoxHalfExtentsAndOffset(mesh) {
            const savedQuat = mesh.quaternion.clone();
            const savedPos = mesh.position.clone();
            mesh.quaternion.identity();
            mesh.position.set(0, 0, 0);
            mesh.updateMatrixWorld(true);

            // PENTING: position/quaternion MESTI dipulihkan tak kira apa jadi semasa
            // pengiraan — kalau tidak, objek "terperangkap" di (0,0,0)/identity secara kekal.
            let size, center;
            try {
                const box = computeVisibleWorldBox3(mesh);
                size = new THREE.Vector3();
                center = new THREE.Vector3();
                box.getSize(size);
                box.getCenter(center);
            } catch (e) {
                console.error('[Physics] computeVisibleWorldBox3 failed for "' + (mesh.userData.fileName || mesh.name) + '" — using a small fallback box:', e);
                size = new THREE.Vector3(0.5, 0.5, 0.5);
                center = new THREE.Vector3(0, 0, 0);
            } finally {
                mesh.quaternion.copy(savedQuat);
                mesh.position.copy(savedPos);
                mesh.updateMatrixWorld(true);
            }

            size.x = Math.max(size.x, 0.02);
            size.y = Math.max(size.y, 0.02);
            size.z = Math.max(size.z, 0.02);
            return { halfExtents: size.multiplyScalar(0.5), offset: center };
        }

        function applyColliderTrim(mesh, halfExtents, offset) {
            const t = mesh.userData.colliderTrim;
            if (!t) return { halfExtents, offset };
            const hx = Math.max(halfExtents.x - ((t.nx || 0) + (t.px || 0)) / 2, 0.02);
            const hy = Math.max(halfExtents.y - ((t.ny || 0) + (t.py || 0)) / 2, 0.02);
            const hz = Math.max(halfExtents.z - ((t.nz || 0) + (t.pz || 0)) / 2, 0.02);
            return {
                halfExtents: { x: hx, y: hy, z: hz },
                offset: {
                    x: offset.x + ((t.nx || 0) - (t.px || 0)) / 2,
                    y: offset.y + ((t.ny || 0) - (t.py || 0)) / 2,
                    z: offset.z + ((t.nz || 0) - (t.pz || 0)) / 2
                }
            };
        }

        function buildPhysicsShapeForMesh(mesh) {
            const primType = mesh.userData.primType;

            if (primType === 'sphere') {
                const radius = 0.6 * ((mesh.scale.x + mesh.scale.y + mesh.scale.z) / 3);
                return { shape: new CANNON.Sphere(Math.max(radius, 0.02)), offset: new CANNON.Vec3(0, 0, 0) };
            }
            if (primType === 'box') {
                const hx = Math.max(0.5 * mesh.scale.x, 0.02);
                const hy = Math.max(0.5 * mesh.scale.y, 0.02);
                const hz = Math.max(0.5 * mesh.scale.z, 0.02);
                const trimmed = applyColliderTrim(mesh, { x: hx, y: hy, z: hz }, { x: 0, y: 0, z: 0 });
                return {
                    shape: new CANNON.Box(new CANNON.Vec3(trimmed.halfExtents.x, trimmed.halfExtents.y, trimmed.halfExtents.z)),
                    offset: new CANNON.Vec3(trimmed.offset.x, trimmed.offset.y, trimmed.offset.z)
                };
            }

            const base = computeLocalBoxHalfExtentsAndOffset(mesh);
            const trimmed = applyColliderTrim(mesh, base.halfExtents, base.offset);
            return {
                shape: new CANNON.Box(new CANNON.Vec3(trimmed.halfExtents.x, trimmed.halfExtents.y, trimmed.halfExtents.z)),
                offset: new CANNON.Vec3(trimmed.offset.x, trimmed.offset.y, trimmed.offset.z)
            };
        }

        function createPhysicsBodyForMesh(mesh) {
            const isDynamic = !!mesh.userData.isGrabbable;
            const { shape, offset } = buildPhysicsShapeForMesh(mesh);
            const bounciness = (typeof mesh.userData.bounciness === 'number') ? mesh.userData.bounciness : 0.4;

            const body = new CANNON.Body({
                mass: isDynamic ? 1 : 0,
                material: getPhysicsMaterialForBounciness(bounciness),
                linearDamping: 0.2,
                angularDamping: 0.4
            });
            body.addShape(shape, offset);

            body.position.set(mesh.position.x, mesh.position.y, mesh.position.z);
            body.quaternion.set(mesh.quaternion.x, mesh.quaternion.y, mesh.quaternion.z, mesh.quaternion.w);
            if (!isDynamic) body.type = CANNON.Body.STATIC;

            return body;
        }

        // ================================================================
        // "INVISIBLE OCCLUDER" CUTOUT — hibrid stencil (bentuk potongan) + gating
        // kedudukan kasar ikut kamera setiap frame (sama ada potongan aktif). Lihat
        // komen penuh dalam index.html berhampiran buildPhysicsWorldFromScene().
        // view.html jadi versi "sentiasa Pratonton" (tiada mod Editing), jadi tiada
        // keperluan paparan kosmetik wireframe — cutter terus invisible sepenuhnya.
        // ================================================================
        const cutterStencilMarkMaterial = new THREE.MeshBasicMaterial({
            colorWrite: false, depthWrite: false, depthTest: false,
            stencilWrite: true, stencilRef: 1, stencilFunc: THREE.AlwaysStencilFunc,
            stencilZPass: THREE.ReplaceStencilOp, stencilZFail: THREE.ReplaceStencilOp, stencilFail: THREE.ReplaceStencilOp,
            side: THREE.DoubleSide
        });

        function ensureCutoutMaterialBackup(mesh) {
            if (mesh.userData._cutoutOrigMaterials) return;
            const map = new Map();
            mesh.traverse(node => { if (node.isMesh) map.set(node, node.material); });
            mesh.userData._cutoutOrigMaterials = map;
        }

        function applyCutterStencilMaterial(mesh) {
            ensureCutoutMaterialBackup(mesh);
            mesh.traverse(node => {
                if (!node.isMesh) return;
                const orig = mesh.userData._cutoutOrigMaterials.get(node);
                const mats = Array.isArray(orig) ? orig : [orig];
                const allTransparent = mats.every(m => m && m.transparent === true);
                node.visible = !allTransparent;
                if (!allTransparent) node.material = cutterStencilMarkMaterial;
                node.renderOrder = -1000;
                node.frustumCulled = false;
            });
        }

        // Sediakan (sekali sahaja, lazy) versi KLON material objek boleh-potong yang
        // diuji terhadap stencil cutter — material sebenar (klon stencil vs asal)
        // ditukar SETIAP FRAME oleh updateCutoutCameraGating() ikut kedudukan kamera.
        function ensureCutoutStencilMaterials(mesh) {
            if (mesh.userData._cutoutStencilMaterials) return;
            ensureCutoutMaterialBackup(mesh);
            const map = new Map();
            mesh.traverse(node => {
                if (!node.isMesh) return;
                const orig = mesh.userData._cutoutOrigMaterials.get(node);
                const wasArray = Array.isArray(orig);
                const mats = wasArray ? orig : [orig];
                const patched = mats.map(m => {
                    const clone = m.clone();
                    clone.stencilWrite = true;
                    clone.stencilFunc = THREE.NotEqualStencilFunc;
                    clone.stencilRef = 1;
                    clone.stencilFuncMask = 0xff;
                    clone.stencilFail = THREE.KeepStencilOp;
                    clone.stencilZFail = THREE.KeepStencilOp;
                    clone.stencilZPass = THREE.KeepStencilOp;
                    return clone;
                });
                map.set(node, wasArray ? patched : patched[0]);
            });
            mesh.userData._cutoutStencilMaterials = map;
        }

        function setCuttableMaterial(mesh, shouldCut) {
            ensureCutoutStencilMaterials(mesh);
            mesh.traverse(node => {
                if (!node.isMesh) return;
                const mats = shouldCut ? mesh.userData._cutoutStencilMaterials : mesh.userData._cutoutOrigMaterials;
                const m = mats.get(node);
                if (m !== undefined) node.material = m;
                node.renderOrder = 0;
            });
        }

        function restoreOriginalMaterial(mesh) {
            if (!mesh.userData._cutoutOrigMaterials) return;
            mesh.traverse(node => {
                if (!node.isMesh) return;
                const orig = mesh.userData._cutoutOrigMaterials.get(node);
                if (orig !== undefined) node.material = orig;
                node.visible = true;
                node.renderOrder = 0;
            });
        }

        function applyCutoutEffect() {
            const cutters = loadedModelsList.filter(m => m.userData.isCutter);
            if (cutters.length === 0) {
                loadedModelsList.forEach(m => restoreOriginalMaterial(m));
                waypointPathMeshes.forEach(m => restoreOriginalMaterial(m));
                return;
            }
            loadedModelsList.forEach(mesh => {
                if (mesh.userData.primType === 'zone') return;
                if (mesh.userData.isCutter) {
                    applyCutterStencilMaterial(mesh);
                } else if (mesh.userData.excludeFromCutout) {
                    restoreOriginalMaterial(mesh);
                }
            });
            // Segmen laluan waypoint ikut flag excludeFromCutout yang sama seperti objek biasa.
            waypointPathMeshes.forEach(mesh => {
                if (mesh.userData.excludeFromCutout) restoreOriginalMaterial(mesh);
            });
            updateCutoutCameraGating();
        }

        // Dipanggil SETIAP FRAME semasa Pratonton (lihat animate()) selagi ada sekurang-
        // kurangnya satu objek cutter — kedudukan kamera boleh berubah tiap frame, jadi
        // gating ni kena dikira semula tiap frame. Guna kedudukan KASAR (bounding box),
        // bukan per-pixel — elak isu precision/z-fighting yang punca hasil "lari"/tak
        // tentu bila dicuba dgn depth-buffer penuh sebelum ni (lihat index.html).
        //
        // NOTA (fix #1, selepas laporan "pusing sikit, tiba2 potong byk/tak potong
        // langsung walaupun nampak bertindih"): mulanya guna titik PIVOT objek
        // (getWorldPosition()) utk kira depth. Fix #1: guna titik PALING HAMPIR pada
        // bounding box CUTTER ke *pusat* target.
        //
        // NOTA (fix #2, superseded by fix #3 below — kept for history): tried mutual
        // clampPoint (each box's nearest point toward the OTHER box's center). Broke when
        // cutter & target overlap deeply with similar size (e.g. a duplicated cube): both
        // centers end up mutually inside each other's box, so clampPoint returns each
        // center UNCHANGED, and "cutter's point" ends up being literally the target's
        // center (and vice versa) — inverting the comparison. That's why a duplicated
        // cube stopped getting cut at all despite deep overlap.
        //
        // Fix #3 (superseded by fix #4 below — kept for history): own-center clamped into
        // the 3D intersection region. Broke when the overlap region is THIN (boxes only
        // touch at a corner/edge, e.g. after moving an object to one end) — clamping both
        // centers into a thin sliver collapses them to nearly the same point regardless of
        // their real original depths, giving wrong/inconsistent cut decisions as objects
        // moved ("moved it to the front, now it wrongly gets cut").
        //
        // Fix #4 — different approach entirely: fix #1-#3 all projected points onto the
        // camera's VIEW DIRECTION (dot product), which is inherently sensitive to camera
        // rotation no matter which reference point is chosen. Fix #4 drops view direction
        // completely: use straight-line DISTANCE from the camera to the closest point on
        // each object's own bounding box (Box3.clampPoint(camPos)) — depends only on
        // camera POSITION and each box's own geometry, never on view direction, so pure
        // camera rotation (no movement) cannot change the cut decision at all. Also never
        // clamps one box into another, so it can't collapse/invert like fix #2/#3 either.
        const _cutoutGatingTmpA = new THREE.Vector3();
        const _cutoutGatingTmpBox = new THREE.Box3();
        function updateCutoutCameraGating() {
            const cutters = loadedModelsList.filter(m => m.userData.isCutter);
            if (cutters.length === 0) return;
            mainCamera.getWorldPosition(_cutoutGatingTmpA);
            const camPos = _cutoutGatingTmpA;

            const cutterBoxes = cutters.map(c => new THREE.Box3().setFromObject(c));

            const gateMesh = (mesh) => {
                const meshBox = _cutoutGatingTmpBox.setFromObject(mesh);
                const meshCenter = meshBox.getCenter(new THREE.Vector3());
                const meshDist = camPos.distanceTo(meshBox.clampPoint(camPos, new THREE.Vector3()));

                let chosenCutterBox = cutterBoxes[0];
                let bestGap = Infinity;
                cutterBoxes.forEach(box => {
                    const gap = box.clampPoint(meshCenter, new THREE.Vector3()).distanceTo(meshCenter);
                    if (gap < bestGap) { bestGap = gap; chosenCutterBox = box; }
                });

                // FIX #5 — objek yg pusat Y dia berada DI ATAS bahagian atas cutter (duduk/
                // berehat atas permukaannya, bukan dlm julat Y cutter) tak pernah patut
                // dipotong, tak kira sudut kamera — lihat nota penuh dlm index.html
                // (dibuktikan guna ujian box matematik: gating jarak lama rosak pd 7/8
                // sudut kamera diuji utk kes ni).
                if (meshCenter.y >= chosenCutterBox.max.y) {
                    setCuttableMaterial(mesh, false);
                    return;
                }

                const cutterDist = camPos.distanceTo(chosenCutterBox.clampPoint(camPos, new THREE.Vector3()));
                setCuttableMaterial(mesh, cutterDist < meshDist);
            };

            loadedModelsList.forEach(mesh => {
                if (mesh.userData.primType === 'zone') return;
                if (mesh.userData.isCutter || mesh.userData.excludeFromCutout) return;
                gateMesh(mesh);
            });

            // Segmen laluan waypoint boleh dipilih immune (excludeFromCutout) atau ikut
            // gating jarak kamera yang sama macam objek biasa.
            waypointPathMeshes.forEach(mesh => {
                if (mesh.userData.excludeFromCutout) return;
                gateMesh(mesh);
            });
        }

        // Objek nampak → collider aktif. Objek tersembunyi → collider TAK aktif, KECUALI
        // ditanda khas "Keep Collider Active While Hidden" (cth: dinding/penyekat tak
        // kelihatan untuk motong laluan waypoint di sebalik dinding sebenar dalam AR).
        function shouldColliderBeActive(mesh) {
            return mesh.visible !== false || mesh.userData.colliderActiveWhenHidden === true;
        }

        function buildPhysicsWorldFromScene() {
            physicsBodies.forEach(pb => { if (pb.inWorld) physicsWorld.removeBody(pb.body); });
            physicsBodies = [];

            loadedModelsList.forEach(mesh => {
                if (mesh.userData.primType === 'zone') return;
                if (!mesh.userData.isSolid && !mesh.userData.isGrabbable) return;

                try {
                    const body = createPhysicsBodyForMesh(mesh);
                    const inWorld = shouldColliderBeActive(mesh);
                    if (inWorld) physicsWorld.addBody(body);
                    physicsBodies.push({ mesh, body, inWorld });
                    mesh.userData._physicsBody = body;
                } catch (e) {
                    console.error('[Physics] Failed to build physics body for "' + (mesh.userData.fileName || mesh.name) + '" — skipping this object:', e);
                }
            });

            physicsActive = true;
            applyCutoutEffect();
        }

        function syncPhysicsBodiesWithVisibility() {
            physicsBodies.forEach(pb => {
                const shouldBeInWorld = shouldColliderBeActive(pb.mesh);
                if (shouldBeInWorld && !pb.inWorld) {
                    physicsWorld.addBody(pb.body);
                    pb.inWorld = true;
                } else if (!shouldBeInWorld && pb.inWorld) {
                    physicsWorld.removeBody(pb.body);
                    pb.inWorld = false;
                }
            });
        }

        function teardownPhysicsWorld() {
            physicsActive = false;
            physicsBodies.forEach(pb => {
                if (pb.inWorld) physicsWorld.removeBody(pb.body);
                delete pb.mesh.userData._physicsBody;
            });
            physicsBodies = [];
            loadedModelsList.forEach(m => restoreOriginalMaterial(m));
        }

        // RETICLE (penunjuk tap-to-place semasa AR)
        const reticleGeometry = new THREE.RingGeometry(0.08, 0.1, 32).rotateX(-Math.PI / 2);
        const reticleMaterial = new THREE.MeshBasicMaterial({ color: 0x00e5ff });
        const reticle = new THREE.Mesh(reticleGeometry, reticleMaterial);
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);

        let isARSession = false;
        let isPlaced = false;
        let hitTestSource = null;
        let hitTestSourceRequested = false;
        let arAutoPlace = false;

        const clock = new THREE.Clock();
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const infoPopup = document.getElementById('info-popup');
        const arDebugHud = document.getElementById('ar-debug-hud'); // HUD diagnostik sementara — lihat index.html
        let infoPopupHideTimer = null;

        const gltfLoader = new THREE.GLTFLoader();
        const fbxLoader = new THREE.FBXLoader();

        function showPopupMessage(message, duration) {
            infoPopup.innerText = message;
            infoPopup.style.left = '50%';
            infoPopup.style.top = 'auto';
            infoPopup.style.bottom = '30px';
            infoPopup.style.transform = 'translateX(-50%)';
            infoPopup.style.display = 'block';

            clearTimeout(infoPopupHideTimer);
            infoPopupHideTimer = setTimeout(() => { infoPopup.style.display = 'none'; }, duration);
        }

        function showInfoPopupAtPointer(title, content, duration, clientX, clientY) {
            infoPopup.innerHTML = '';
            if (title) {
                const elTitle = document.createElement('div');
                elTitle.className = 'info-popup-title';
                elTitle.textContent = title;
                infoPopup.appendChild(elTitle);
            }
            const elContent = document.createElement('div');
            elContent.className = 'info-popup-content';
            elContent.textContent = content || '';
            infoPopup.appendChild(elContent);

            infoPopup.style.bottom = 'auto';
            infoPopup.style.transform = 'none';
            infoPopup.style.display = 'block';

            const containerRect = container.getBoundingClientRect();
            let left = clientX - containerRect.left + 16;
            let top = clientY - containerRect.top + 16;

            const maxLeft = container.clientWidth - infoPopup.offsetWidth - 10;
            const maxTop = container.clientHeight - infoPopup.offsetHeight - 10;
            left = Math.max(10, Math.min(left, Math.max(10, maxLeft)));
            top = Math.max(10, Math.min(top, Math.max(10, maxTop)));

            infoPopup.style.left = left + 'px';
            infoPopup.style.top = top + 'px';

            clearTimeout(infoPopupHideTimer);
            infoPopupHideTimer = setTimeout(() => { infoPopup.style.display = 'none'; }, duration);
        }

        // ---------------------------------------------------------------
        // BINA OBJEK DARI DATA TERSIMPAN
        // ---------------------------------------------------------------
        function setupAnimationMixerFor(object3D, animations) {
            let mixer = null, animAction = null;
            if (animations && animations.length > 0) {
                mixer = new THREE.AnimationMixer(object3D);
                animAction = mixer.clipAction(animations[0]);

                mixer.addEventListener('finished', function (e) {
                    if (e.action === animAction) {
                        if (object3D.userData.interactions) {
                            const animAct = object3D.userData.interactions.find(a => a.action === 'toggleModelAnim');
                            if (animAct && animAct.animMode === 'toggleReverse') {
                                if (object3D.userData.animState === 'playing_fwd') {
                                    object3D.userData.animState = 'atEnd';
                                } else if (object3D.userData.animState === 'playing_rev') {
                                    object3D.userData.animState = 'atStart';
                                }
                            } else {
                                object3D.userData.animState = 'stopped';
                            }
                        }
                    }
                });
            }
            return { mixer, animAction };
        }

        function createModelFromData(objData) {
            return new Promise((resolve) => {
                const url = objData.fileUrl;
                if (!url) { resolve(null); return; }

                const ext = objData.fileExt || 'glb';

                const onLoaded = (loadedRoot, animations) => {
                    const mixerInfo = setupAnimationMixerFor(loadedRoot, animations);

                    loadedRoot.userData = {
                        id: objData.id,
                        fileName: objData.fileName,
                        kind: 'model',
                        interactions: objData.interactions || [],
                        initialVisibility: objData.initialVisibility,
                        colliderActiveWhenHidden: objData.colliderActiveWhenHidden || false,
                        isCutter: objData.isCutter || false,
                        excludeFromCutout: objData.excludeFromCutout || false,
                        // "Kedudukan asal" untuk Return-to-Original-on-Release MESTI guna
                        // objData.position (kedudukan TERKINI/terakhir disimpan dari Editor),
                        // BUKAN objData.initialPosition (itu posisi masa objek PERTAMA kali
                        // dicipta/upload dalam Editor — tak pernah dikemaskini lepas tu, jadi
                        // lapuk/jauh berbeza kalau objek dah digerakkan sebelum disimpan).
                        initialPosition: new THREE.Vector3().fromArray(objData.position),
                        initialRotation: new THREE.Euler().fromArray(objData.rotation),
                        isGrabbable: objData.isGrabbable || false,
                        isSolid: objData.isSolid || false,
                        returnToOriginalOnRelease: objData.returnToOriginalOnRelease || false,
                        bounciness: (typeof objData.bounciness === 'number') ? objData.bounciness : 0.4,
                        colliderTrim: objData.colliderTrim || null,
                        isRotating: false,
                        mixer: mixerInfo.mixer,
                        animAction: mixerInfo.animAction,
                        animState: 'stopped',
                        stepStateToggle: false
                    };

                    loadedRoot.position.fromArray(objData.position);
                    loadedRoot.rotation.set(objData.rotation[0], objData.rotation[1], objData.rotation[2]);
                    loadedRoot.scale.fromArray(objData.scale);

                    fixModelMaterialLighting(loadedRoot);

                    contentRoot.add(loadedRoot);
                    loadedModelsList.push(loadedRoot);
                    resolve(loadedRoot);
                };

                const onErr = (err) => { console.error('Ralat memuat model:', err); resolve(null); };

                if (ext === 'fbx') {
                    fbxLoader.load(url, (fbx) => onLoaded(fbx, fbx.animations), undefined, onErr);
                } else {
                    gltfLoader.load(url, (gltf) => onLoaded(gltf.scene, gltf.animations), undefined, onErr);
                }
            });
        }

        function createImageFromData(objData) {
            return new Promise((resolve) => {
                if (!objData.fileUrl) { resolve(null); return; }
                const loader = new THREE.TextureLoader();

                loader.load(objData.fileUrl, (texture) => {
                    texture.encoding = THREE.sRGBEncoding;
                    const imgW = texture.image ? texture.image.width : 0;
                    const imgH = texture.image ? texture.image.height : 0;
                    const aspect = (imgW && imgH) ? (imgW / imgH) : 1;
                    const height = 2;
                    const width = height * aspect;

                    const geometry = new THREE.PlaneGeometry(width, height);
                    const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
                    const mesh = new THREE.Mesh(geometry, material);

                    mesh.userData = {
                        id: objData.id,
                        fileName: objData.fileName,
                        kind: 'image',
                        interactions: objData.interactions || [],
                        initialVisibility: objData.initialVisibility,
                        colliderActiveWhenHidden: objData.colliderActiveWhenHidden || false,
                        isCutter: objData.isCutter || false,
                        excludeFromCutout: objData.excludeFromCutout || false,
                        initialPosition: new THREE.Vector3().fromArray(objData.position),
                        initialRotation: new THREE.Euler().fromArray(objData.rotation),
                        isGrabbable: objData.isGrabbable || false,
                        isSolid: objData.isSolid || false,
                        returnToOriginalOnRelease: objData.returnToOriginalOnRelease || false,
                        bounciness: (typeof objData.bounciness === 'number') ? objData.bounciness : 0.4,
                        colliderTrim: objData.colliderTrim || null,
                        isRotating: false,
                        mixer: null,
                        animAction: null,
                        animState: 'stopped',
                        stepStateToggle: false
                    };

                    mesh.position.fromArray(objData.position);
                    mesh.rotation.set(objData.rotation[0], objData.rotation[1], objData.rotation[2]);
                    mesh.scale.fromArray(objData.scale);

                    contentRoot.add(mesh);
                    loadedModelsList.push(mesh);
                    resolve(mesh);
                }, undefined, (err) => { console.error('Ralat memuat gambar:', err); resolve(null); });
            });
        }

        // ---- WAYPOINT / LALUAN PANDU ARAH (garis anak panah biru mengalir antara waypoint) ----
        // Sama macam editor: satah bertekstur anak panah berulang (bukan THREE.Line), disambung
        // ikut turutan waypoint dalam loadedModelsList, dan condong ikut jarak 3D sebenar supaya
        // boleh naik/turun tangga.
        let waypointArrowTexture = null;
        function getWaypointArrowTexture() {
            if (waypointArrowTexture) return waypointArrowTexture;
            const size = 128;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, size, size);
            ctx.strokeStyle = '#29b6f6';
            ctx.lineWidth = size * 0.16;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(size * 0.2, size * 0.15);
            ctx.lineTo(size * 0.7, size * 0.5);
            ctx.lineTo(size * 0.2, size * 0.85);
            ctx.stroke();

            waypointArrowTexture = new THREE.CanvasTexture(canvas);
            waypointArrowTexture.wrapS = THREE.RepeatWrapping;
            waypointArrowTexture.wrapT = THREE.ClampToEdgeWrapping;
            return waypointArrowTexture;
        }

        const WAYPOINT_PATH_TILE_SIZE = 0.4;
        const WAYPOINT_PATH_WIDTH = 0.25;
        const WAYPOINT_PATH_SCROLL_SPEED = 0.6;
        const WAYPOINT_WORLD_UP = new THREE.Vector3(0, 1, 0);
        let waypointPathMeshes = [];

        function clearWaypointPath() {
            waypointPathMeshes.forEach(m => {
                contentRoot.remove(m);
                m.geometry.dispose();
                m.material.dispose();
            });
            waypointPathMeshes = [];
        }

        function rebuildWaypointPath() {
            clearWaypointPath();

            const waypoints = loadedModelsList.filter(o => o.userData.primType === 'waypoint');
            if (waypoints.length < 2) return;

            const baseTexture = getWaypointArrowTexture();

            for (let i = 0; i < waypoints.length - 1; i++) {
                const a = waypoints[i].position;
                const b = waypoints[i + 1].position;
                const dx = b.x - a.x;
                const dy = b.y - a.y;
                const dz = b.z - a.z;
                const length = Math.sqrt(dx * dx + dy * dy + dz * dz);
                if (length < 0.001) continue;

                const forward = new THREE.Vector3(dx, dy, dz).multiplyScalar(1 / length);
                let right = new THREE.Vector3().crossVectors(forward, WAYPOINT_WORLD_UP);
                if (right.lengthSq() < 1e-6) {
                    right.crossVectors(forward, new THREE.Vector3(1, 0, 0));
                }
                right.normalize();
                const up = new THREE.Vector3().crossVectors(right, forward).normalize();

                const segGeometry = new THREE.PlaneGeometry(length, WAYPOINT_PATH_WIDTH);
                segGeometry.rotateX(-Math.PI / 2);

                const repeatX = Math.max(1, length / WAYPOINT_PATH_TILE_SIZE);
                const uvAttr = segGeometry.attributes.uv;
                for (let vi = 0; vi < uvAttr.count; vi++) {
                    uvAttr.setX(vi, uvAttr.getX(vi) * repeatX);
                }
                uvAttr.needsUpdate = true;

                const segMaterial = new THREE.MeshBasicMaterial({
                    map: baseTexture,
                    transparent: true,
                    depthWrite: false,
                    side: THREE.DoubleSide
                });

                const segMesh = new THREE.Mesh(segGeometry, segMaterial);
                segMesh.position.set((a.x + b.x) / 2, (a.y + b.y) / 2, (a.z + b.z) / 2);
                segMesh.position.addScaledVector(up, 0.01);
                segMesh.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(forward, up, right));
                segMesh.renderOrder = 10;
                segMesh.userData.isWaypointPathSegment = true;
                segMesh.userData.excludeFromCutout = !!(waypoints[i].userData.excludeFromCutout || waypoints[i + 1].userData.excludeFromCutout);

                contentRoot.add(segMesh);
                waypointPathMeshes.push(segMesh);
            }
        }

        // Pulangkan PROMISE (bukan mesh terus) — sama macam createModelFromData/
        // createImageFromData — supaya applySceneDataToViewport() boleh await ia. Tanpa ni,
        // texture custom (TextureLoader.load, async) boleh belum siap muat bila
        // applyCutoutEffect() clone material objek (ensureCutoutStencilMaterials) — clone
        // tu snapshot BEKU, texture yang sampai LEPAS clone dibuat takkan terpapar pada
        // clone tu, jadi bahagian objek yang kena cutout tinggal base color je. Fail
        // export/view.html terus jalan tanpa "jeda" (lain dgn editor yg ada jeda semula
        // jadi: load projek → pengguna tengok-tengok → klik Preview), jadi race condition
        // ni selalu kena di sini walaupun jarang nampak di editor.
        function createPrimitiveFromData(objData) {
            return new Promise((resolve) => {
            let geometry, material;
            const type = objData.primType;

            material = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.4, metalness: 0.2, side: THREE.DoubleSide });

            if (type === 'box') {
                geometry = new THREE.BoxGeometry(1, 1, 1);
            } else if (type === 'sphere') {
                geometry = new THREE.SphereGeometry(0.6, 32, 32);
            } else if (type === 'cylinder') {
                geometry = new THREE.CylinderGeometry(0.5, 0.5, 1.2, 32);
            } else if (type === 'plane') {
                geometry = new THREE.PlaneGeometry(2, 2);
            } else if (type === 'zone') {
                geometry = new THREE.BoxGeometry(0.4, 0.4, 0.4);
                material = new THREE.MeshBasicMaterial({ color: 0x00e5ff, wireframe: true, transparent: true, opacity: 0.8 });
            } else if (type === 'waypoint') {
                geometry = new THREE.CircleGeometry(0.15, 24);
                material = new THREE.MeshBasicMaterial({ color: 0x2196f3, transparent: true, opacity: 0.85, side: THREE.DoubleSide });
            } else if (type === 'text') {
                const userText = objData.textContent || '';
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 1024;
                canvas.height = 256;

                ctx.fillStyle = 'rgba(20, 20, 20, 0.8)';
                ctx.roundRect ? ctx.roundRect(0, 0, canvas.width, canvas.height, 30) : ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fill();

                ctx.strokeStyle = '#007acc';
                ctx.lineWidth = 15;
                ctx.strokeRect(0, 0, canvas.width, canvas.height);

                ctx.font = 'bold 80px "Segoe UI", sans-serif';
                ctx.fillStyle = 'white';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(userText, canvas.width / 2, canvas.height / 2);

                const texture = new THREE.CanvasTexture(canvas);
                material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
                geometry = new THREE.PlaneGeometry(4, 1);
            } else {
                geometry = new THREE.BoxGeometry(1, 1, 1);
            }

            const mesh = new THREE.Mesh(geometry, material);
            mesh.userData = {
                id: objData.id,
                fileName: objData.fileName,
                kind: 'primitive',
                primType: type,
                interactions: objData.interactions || [],
                initialVisibility: objData.initialVisibility,
                colliderActiveWhenHidden: objData.colliderActiveWhenHidden || false,
                isCutter: objData.isCutter || false,
                excludeFromCutout: objData.excludeFromCutout || false,
                initialPosition: new THREE.Vector3().fromArray(objData.position),
                initialRotation: new THREE.Euler().fromArray(objData.rotation),
                isGrabbable: objData.isGrabbable || false,
                isSolid: objData.isSolid || false,
                returnToOriginalOnRelease: objData.returnToOriginalOnRelease || false,
                bounciness: (typeof objData.bounciness === 'number') ? objData.bounciness : 0.4,
                colliderTrim: objData.colliderTrim || null,
                isRotating: false,
                mixer: null,
                animAction: null,
                animState: 'stopped',
                stepStateToggle: false
            };

            if (['box', 'sphere', 'cylinder', 'plane'].includes(type) && objData.customColor) {
                // renderer.outputEncoding = sRGBEncoding — Color.set() dari hex string
                // (r128) simpan nilai MENTAH tanpa tukar ke linear, jadi perlu convert
                // manual supaya warna terpapar sama macam dipilih dalam editor (lihat
                // index.html untuk nota penuh).
                material.color.set(objData.customColor).convertSRGBToLinear();
                mesh.userData.customColor = objData.customColor;
            }

            mesh.position.fromArray(objData.position);
            mesh.rotation.set(objData.rotation[0], objData.rotation[1], objData.rotation[2]);
            mesh.scale.fromArray(objData.scale);

            contentRoot.add(mesh);
            loadedModelsList.push(mesh);

            if (['box', 'sphere', 'cylinder', 'plane'].includes(type) && objData.customTextureUrl) {
                mesh.userData.customTextureUrl = objData.customTextureUrl;
                new THREE.TextureLoader().load(objData.customTextureUrl, (tex) => {
                    material.map = tex;
                    material.needsUpdate = true;
                    resolve(mesh);
                }, undefined, (err) => {
                    console.error('Ralat memuat texture bentuk:', err);
                    resolve(mesh);
                });
            } else {
                resolve(mesh);
            }
            });
        }

        // ---------------------------------------------------------------
        // PENGURUSAN SCENE (baca sahaja)
        // ---------------------------------------------------------------
        function clearViewportObjects() {
            [...loadedModelsList].forEach(m => {
                contentRoot.remove(m);
                m.traverse((child) => {
                    if (child.isMesh) {
                        if (child.geometry) child.geometry.dispose();
                        const materials = Array.isArray(child.material) ? child.material : [child.material];
                        materials.forEach(mat => {
                            if (!mat) return;
                            if (mat.map) mat.map.dispose();
                            mat.dispose();
                        });
                    }
                });
            });
            loadedModelsList.length = 0;
            hoveredModel = null;
            clearWaypointPath();
            teardownPhysicsWorld();
        }

        // Cetuskan semua tindakan "onStart" (Sebaik Scene Dimulakan) sekali sahaja setiap
        // kali kandungan scene benar-benar jadi aktif/kelihatan pada pengguna.
        function fireSceneStartTriggers() {
            // Reset status animasi (play/pause/toggleReverse) ke keadaan asal SETIAP
            // kali scene "bermula" (scene dimuat, AR diletak semula, dll) — kalau
            // tidak, status main/jeda terbawa dari sesi sebelumnya, jadi tindakan
            // "Mula/Henti Animasi" yang dipasang pada onStart akan selang-seli
            // (sekali main, sekali jeda) bukan sentiasa main semula dari permulaan.
            loadedModelsList.forEach(m => {
                if (m.userData.mixer && m.userData.animAction) {
                    m.userData.animAction.stop();
                    m.userData.animAction.reset();
                    m.userData.animAction.paused = false;
                    m.userData.animState = 'stopped';
                    m.userData.mixer.update(0);
                }
            });

            loadedModelsList.forEach(m => {
                if (m.userData.interactions && m.userData.interactions.some(act => act.trigger === 'onStart')) {
                    triggerInteraction(m, 'onStart');
                }
            });
        }

        function applyVisibilityAndCamera() {
            loadedModelsList.forEach(m => {
                m.visible = (m.userData.primType === 'zone') ? false : (m.userData.initialVisibility !== false);
            });

            if (renderer.xr.isPresenting) {
                cameraRig.position.set(sceneCameraData.position[0], sceneCameraData.position[1], sceneCameraData.position[2]);
                cameraRig.rotation.set(sceneCameraData.rotation[0], sceneCameraData.rotation[1], sceneCameraData.rotation[2]);
                mainCamera.position.set(0, 0, 0);
                mainCamera.rotation.set(0, 0, 0);
            } else {
                cameraRig.position.set(0, 0, 0);
                cameraRig.rotation.set(0, 0, 0);
                mainCamera.position.set(sceneCameraData.position[0], sceneCameraData.position[1], sceneCameraData.position[2]);
                mainCamera.rotation.set(sceneCameraData.rotation[0], sceneCameraData.rotation[1], sceneCameraData.rotation[2]);

                controls.target.copy(findCameraOrbitTarget(mainCamera.position, mainCamera.quaternion, 3));
                controls.update();
            }

            buildPhysicsWorldFromScene();
            fireSceneStartTriggers();
        }

        // Fallback bila hit-test AR tak disokong peranti/browser — letak kandungan
        // 1.5m di hadapan titik mula sesi AR (tak sepersis tap-to-place, tapi tetap
        // world-locked dan tak "ikut kamera").
        function placeContentAtDefault() {
            contentRoot.position.set(0, 0, -1.5);
            contentRoot.quaternion.identity();
            isPlaced = true;
            reticle.visible = false;
            loadedModelsList.forEach(m => {
                m.visible = (m.userData.primType === 'zone') ? false : (m.userData.initialVisibility !== false);
            });
            buildPhysicsWorldFromScene();
            fireSceneStartTriggers();
        }

        function placeContentAtReticle() {
            contentRoot.position.setFromMatrixPosition(reticle.matrix);
            contentRoot.quaternion.setFromRotationMatrix(reticle.matrix);
            isPlaced = true;
            reticle.visible = false;
            loadedModelsList.forEach(m => {
                m.visible = (m.userData.primType === 'zone') ? false : (m.userData.initialVisibility !== false);
            });
            buildPhysicsWorldFromScene();
            fireSceneStartTriggers();
        }

        async function applySceneDataToViewport(sceneObj) {
            // Tangkap status SEBELUM ia di-reset di bawah — bezakan antara "baru
            // masuk AR, belum letak lagi" (perlu tunggu tap-to-place) dengan "dah
            // letak, scene ni ditukar semasa sesi AR sedang berjalan" (anchor
            // dunia sebenar tak sepatutnya berubah hanya sebab kandungan bertukar).
            const alreadyAnchoredInAR = renderer.xr.isPresenting && isARSession && isPlaced;

            // Semasa sesi AR (passthrough) aktif, scene.background MESTI kekal null
            // supaya kamera dunia sebenar kelihatan — jangan timpa dengan warna latar
            // scene baru (itu akan "tutup" passthrough, tinggal objek je kelihatan).
            // Simpan warna baru tu untuk dipulihkan bila sesi AR tamat nanti.
            if (renderer.xr.isPresenting && isARSession) {
                savedSceneBackgroundForAR = new THREE.Color(sceneObj.bgColor || '#87ceeb');
            } else {
                scene.background = new THREE.Color(sceneObj.bgColor || '#87ceeb');
            }
            sceneCameraData = sceneObj.camera || { position: [0, 2, 6], rotation: [0, 0, 0] };
            arAutoPlace = !!sceneObj.arAutoPlace;

            for (const objData of (sceneObj.objects || [])) {
                if (objData.kind === 'model') {
                    await createModelFromData(objData);
                } else if (objData.kind === 'image') {
                    await createImageFromData(objData);
                } else {
                    await createPrimitiveFromData(objData);
                }
            }

            rebuildWaypointPath();

            if (isARSession) {
                if (alreadyAnchoredInAR) {
                    // ANCHOR: guna kedudukan/orientasi penjangkaran YANG SAMA dari
                    // penempatan sebelum ni untuk scene baharu ni — pengguna tak
                    // perlu tap-to-place berulang kali setiap kali tukar scene.
                    loadedModelsList.forEach(m => {
                        m.visible = (m.userData.primType === 'zone') ? false : (m.userData.initialVisibility !== false);
                    });
                    buildPhysicsWorldFromScene();
                    fireSceneStartTriggers();
                } else {
                    // Penempatan PERTAMA kali: minta pengguna tap-to-place.
                    isPlaced = false;
                    hitTestSourceRequested = false;
                    hitTestSource = null;
                    reticle.visible = false;
                    contentRoot.position.set(0, 0, 0);
                    contentRoot.quaternion.identity();
                    loadedModelsList.forEach(m => { m.visible = false; });
                }
            } else {
                applyVisibilityAndCamera();
            }
        }

        async function switchToScene(sceneId) {
            if (sceneId === activeSceneId) return;
            const sceneObj = fullScenesData.find(s => s.id === sceneId);
            if (!sceneObj) return;

            clearViewportObjects();
            activeSceneId = sceneId;
            await applySceneDataToViewport(sceneObj);
        }

        async function changeSceneDuringInteraction(targetSceneId) {
            if (!targetSceneId || targetSceneId === activeSceneId) return;
            await switchToScene(targetSceneId);
        }

        // ---------------------------------------------------------------
        // SISTEM INTERAKSI (sama logik seperti editor mod pratonton)
        // ---------------------------------------------------------------
        function getTargetObjects(sourceModel, targetIdsArray) {
            if (!targetIdsArray || !Array.isArray(targetIdsArray) || targetIdsArray.length === 0) {
                return [sourceModel];
            }
            const targets = [];
            targetIdsArray.forEach(id => {
                if (id === 'self') {
                    if (!targets.includes(sourceModel)) targets.push(sourceModel);
                } else {
                    const found = loadedModelsList.find(o => o.userData.id == id);
                    if (found && !targets.includes(found)) targets.push(found);
                }
            });
            return targets.length > 0 ? targets : [sourceModel];
        }

        function getActionSummaryDummy() { /* tidak diperlukan dalam viewer */ }

        function triggerInteraction(model, eventType, clientX, clientY) {
            if (!model.userData.interactions || !Array.isArray(model.userData.interactions)) return;

            const matchingActions = model.userData.interactions.filter(act => act.trigger === eventType);
            if (matchingActions.length === 0) return;

            matchingActions.forEach(config => {
                const targets = getTargetObjects(model, config.targetObjectIds);

                if (config.action === 'toggleModelAnim') {
                    targets.forEach(targetObj => {
                        if (targetObj.userData.mixer && targetObj.userData.animAction) {
                            const action = targetObj.userData.animAction;
                            const state = targetObj.userData.animState;
                            const clipDuration = action.getClip().duration;

                            const startTime = Math.max(0, config.animStartTime || 0);
                            const endTime = (config.animEndTime && config.animEndTime > startTime)
                                ? Math.min(config.animEndTime, clipDuration)
                                : clipDuration;

                            targetObj.userData.customStartTime = startTime;
                            targetObj.userData.customEndTime = endTime;
                            targetObj.userData.animDir = config.animDir;

                            if (config.animMode === 'toggleReverse') {
                                action.setLoop(THREE.LoopOnce, 1);
                                action.clampWhenFinished = true;

                                if (state === 'stopped' || state === 'atStart') {
                                    action.reset();
                                    action.time = startTime;
                                    action.timeScale = 1;
                                    action.play();
                                    action.paused = false;
                                    targetObj.userData.animState = 'playing_fwd';
                                } else if (state === 'atEnd' || state === 'playing_fwd') {
                                    action.paused = false;
                                    action.timeScale = -1;
                                    if (action.time >= endTime) action.time = endTime;
                                    action.play();
                                    targetObj.userData.animState = 'playing_rev';
                                } else if (state === 'playing_rev') {
                                    action.paused = false;
                                    action.timeScale = 1;
                                    action.play();
                                    targetObj.userData.animState = 'playing_fwd';
                                }
                            } else {
                                if (config.animMode === 'once') {
                                    action.setLoop(THREE.LoopOnce, 1);
                                    action.clampWhenFinished = true;
                                } else {
                                    action.setLoop(THREE.LoopRepeat, Infinity);
                                }

                                if (state === 'stopped' || state === 'paused') {
                                    if (state === 'stopped') action.reset();
                                    if (action.time < startTime || action.time >= endTime) action.time = startTime;
                                    action.timeScale = (config.animDir === 'reverse') ? -1 : 1;
                                    action.play();
                                    action.paused = false;
                                    targetObj.userData.animState = 'playing';
                                } else {
                                    action.paused = true;
                                    targetObj.userData.animState = 'paused';
                                }
                            }
                        }
                    });
                }
                else if (config.action === 'stepMove') {
                    targets.forEach(targetObj => {
                        const stepVec = new THREE.Vector3(config.stepX || 0, config.stepY || 0, config.stepZ || 0);
                        stepVec.applyQuaternion(targetObj.quaternion);

                        if (config.stepMode === 'toggle') {
                            if (!targetObj.userData.stepStateToggle) {
                                targetObj.position.add(stepVec);
                                targetObj.userData.stepStateToggle = true;
                            } else {
                                targetObj.position.sub(stepVec);
                                targetObj.userData.stepStateToggle = false;
                            }
                        } else {
                            targetObj.position.add(stepVec);
                        }
                    });
                }
                else if (config.action === 'toggleTargetVisibility') {
                    targets.forEach(targetObj => {
                        targetObj.visible = !targetObj.visible;
                    });
                }
                else if (config.action === 'changeColor') {
                    targets.forEach(targetObj => {
                        targetObj.traverse((child) => {
                            if (child.isMesh && child.material && child.material.color) {
                                child.material.color.setHex(Math.random() * 0xffffff);
                            }
                        });
                    });
                }
                else if (config.action === 'rotateAnim') {
                    targets.forEach(targetObj => {
                        targetObj.userData.isRotating = !targetObj.userData.isRotating;
                    });
                }
                else if (config.action === 'popInfo') {
                    const containerRect = container.getBoundingClientRect();
                    const px = (typeof clientX === 'number') ? clientX : (containerRect.left + container.clientWidth / 2);
                    const py = (typeof clientY === 'number') ? clientY : (containerRect.top + container.clientHeight / 2);
                    const popupDuration = (eventType === 'onHover') ? 3600000 : 3000;
                    showInfoPopupAtPointer(config.noteTitle, config.note || "Maklumat Objek", popupDuration, px, py);
                }
                else if (config.action === 'playSound') {
                    if (config.audioFile && uploadedAudios[config.audioFile]) {
                        const audio = new Audio(uploadedAudios[config.audioFile]);
                        audio.play();
                    }
                }
                else if (config.action === 'changeScene') {
                    changeSceneDuringInteraction(config.targetSceneId);
                }
            });

            const hasPopInfo = matchingActions.some(a => a.action === 'popInfo');
            if (!hasPopInfo) {
                showPopupMessage(`⚡ ${matchingActions.length} Tindakan Dijalankan!`, 1500);
            }
        }

        // ---------------------------------------------------------------
        // INPUT: TETIKUS/TOUCH (klik & hover)
        // ---------------------------------------------------------------
        let pointerDownPos = { x: 0, y: 0 };

        renderer.domElement.addEventListener('pointerdown', (event) => {
            pointerDownPos.x = event.clientX;
            pointerDownPos.y = event.clientY;

            // GENGGAM MOUSE (desktop, bukan sesi XR) — JANGAN genggam serta-merta; simpan
            // sebagai CALON dulu, cuma sahkan jadi genggaman sebenar kalau mouse betul-betul
            // bergerak melepasi threshold 5px (lihat pointermove) — kalau tidak (klik tulen),
            // pointerup jatuh terus ke laluan klik/onClick biasa di bawah.
            if (!renderer.xr.isPresenting && !grabbedObject && event.button === 0) {
                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
                raycaster.setFromCamera(mouse, mainCamera);

                const grabTargets = loadedModelsList.filter(o => o.visible && o.userData.isGrabbable);
                const intersects = raycaster.intersectObjects(grabTargets, true);
                if (intersects.length > 0) {
                    let hitModel = intersects[0].object;
                    while (hitModel.parent && hitModel.parent !== scene && hitModel.parent !== contentRoot) {
                        hitModel = hitModel.parent;
                    }
                    if (hitModel.userData.isGrabbable) {
                        pendingGrabCandidate = { hitModel, point: intersects[0].point.clone() };
                        try { renderer.domElement.setPointerCapture(event.pointerId); } catch (e) {}
                    }
                }
            }
        });

        renderer.domElement.addEventListener('pointerup', (event) => {
            if (event.button !== 0) return;

            if (isMouseGrabbing) {
                isMouseGrabbing = false;
                controls.enabled = true;
                try { renderer.domElement.releasePointerCapture(event.pointerId); } catch (e) {}
                onControllerSelectEnd();
                return;
            }

            if (pendingGrabCandidate) {
                pendingGrabCandidate = null;
                try { renderer.domElement.releasePointerCapture(event.pointerId); } catch (e) {}
            }

            const deltaX = Math.abs(event.clientX - pointerDownPos.x);
            const deltaY = Math.abs(event.clientY - pointerDownPos.y);
            if (deltaX > 5 || deltaY > 5) return;

            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, mainCamera);

            if (loadedModelsList.length > 0) {
                const visibleObjects = loadedModelsList.filter(o => o.visible);
                const intersects = raycaster.intersectObjects(visibleObjects, true);
                if (intersects.length > 0) {
                    let hitModel = intersects[0].object;
                    while (hitModel.parent && hitModel.parent !== scene && hitModel.parent !== contentRoot) {
                        hitModel = hitModel.parent;
                    }
                    triggerInteraction(hitModel, 'onClick', event.clientX, event.clientY);
                }
            }
        });

        renderer.domElement.addEventListener('pointermove', (event) => {
            if (pendingGrabCandidate && !isMouseGrabbing) {
                const dX = Math.abs(event.clientX - pointerDownPos.x);
                const dY = Math.abs(event.clientY - pointerDownPos.y);
                if (dX > 5 || dY > 5) {
                    startMouseGrab(pendingGrabCandidate.hitModel, pendingGrabCandidate.point);
                    pendingGrabCandidate = null;
                } else {
                    return;
                }
            }

            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, mainCamera);

            if (isMouseGrabbing && grabbedObject) {
                const target = new THREE.Vector3();
                if (raycaster.ray.intersectPlane(mouseGrabPlane, target)) {
                    mouseGrabProxy.position.lerp(target, 0.6);
                }
                return;
            }

            let hitModel = null;
            if (loadedModelsList.length > 0) {
                const visibleObjects = loadedModelsList.filter(o => o.visible);
                const intersects = raycaster.intersectObjects(visibleObjects, true);
                if (intersects.length > 0) {
                    hitModel = intersects[0].object;
                    while (hitModel.parent && hitModel.parent !== scene && hitModel.parent !== contentRoot) {
                        hitModel = hitModel.parent;
                    }
                }
            }

            if (hitModel !== hoveredModel) {
